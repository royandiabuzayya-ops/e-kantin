  document.getElementById('aiWrap').before(aiBtnWrap);
  document.getElementById('askAiBtn')?.addEventListener('click', async ()=>{
    const btn = document.getElementById('askAiBtn');
    btn.innerHTML = 'Menghubungi AI...'; btn.disabled = true;
    try{
      const data = buildData();
      const answer = await askAiDiagnosis(data);
      data.aiJawaban = answer; data.aiStatus = 'selesai';
      const saved = addOrUpdateDiagnosis(data);
      document.getElementById('aiWrap').innerHTML = `<div class="ai-card"><h4>${ICONS.robot} Jawaban AI</h4><p>${escapeHtml(answer)}</p></div>`;
      toast('AI memberi jawaban');
    }catch(err){
      toast('Gagal: '+err.message);
    } finally {
      btn.innerHTML = ICONS.robot+' Tanya AI (butuh internet)'; btn.disabled = false;
    }
  });
}

/* ---- Pesan Pribadi (DM) ---- */
async function komunitasFetchConversations(){
  const { data, error } = await sb.from('messages').select('*').or(`sender_id.eq.${authUser.id},recipient_id.eq.${authUser.id}`).order('created_at', { ascending:false }).limit(200);
  if(error) throw new Error(error.message);
  const map = new Map();
  (data||[]).forEach(m=>{
    const otherId = m.sender_id===authUser.id ? m.recipient_id : m.sender_id;
    if(!map.has(otherId)) map.set(otherId, { otherId, last:m, unread:0 });
    if(m.recipient_id===authUser.id && !m.is_read) map.get(otherId).unread++;
  });
  const convos = [...map.values()];
  const ids = convos.map(c=>c.otherId);
  if(ids.length){
    const { data: profs } = await sb.from('profiles').select('id, username, role').in('id', ids);
    convos.forEach(c=> c.username = (profs||[]).find(p=>p.id===c.otherId)?.username || 'Pengguna');
  }
  return convos;
}
async function komunitasFetchThread(otherId){
  const { data, error } = await sb.from('messages').select('*')
    .or(`and(sender_id.eq.${authUser.id},recipient_id.eq.${otherId}),and(sender_id.eq.${otherId},recipient_id.eq.${authUser.id})`)
    .order('created_at', { ascending:true }).limit(200);
  if(error) throw new Error(error.message);
  return data || [];
}
async function komunitasSendMessage(recipientId, isi){
  const { error } = await sb.from('messages').insert({ sender_id:authUser.id, recipient_id:recipientId, isi });
  if(error) throw new Error(error.message);
}
async function komunitasMarkThreadRead(otherId){
  const { error } = await sb.from('messages').update({ is_read:true }).eq('sender_id', otherId).eq('recipient_id', authUser.id).eq('is_read', false);
  if(error) throw new Error(error.message);
}

/* ---- Realtime: badge & toast notifikasi langsung selagi aplikasi terbuka ---- */
let komRealtimeChannel = null;
function subscribeKomunitasRealtime(){
  if(!sbReady() || !authUser || komRealtimeChannel) return;
  try{
    komRealtimeChannel = sb.channel('kom-notif-'+authUser.id)
      .on('postgres_changes', { event:'INSERT', schema:'public', table:'notifications', filter:`user_id=eq.${authUser.id}` }, (payload)=>{
        refreshKomNotifBadge();
        toast(notifTypeToast(payload.new && payload.new.type));
      })
      .subscribe();
  }catch(e){ komRealtimeChannel = null; }
}
function unsubscribeKomunitasRealtime(){
  if(komRealtimeChannel){ try{ sb.removeChannel(komRealtimeChannel); }catch(e){} komRealtimeChannel = null; }
}
function notifTypeToast(type){
  if(type==='comment') return 'Ada komentar baru di kasus Anda';
  if(type==='reply') return 'Ada balasan baru untuk komentar Anda';
  if(type==='dm') return 'Ada pesan pribadi baru';
  return 'Ada notifikasi baru';
}
async function refreshKomNotifBadge(){
  const badge = document.getElementById('komNotifBadge');
  if(!badge) return;
  const n = await komunitasUnreadNotifCount();
  badge.style.display = n>0 ? 'flex' : 'none';
  badge.textContent = n>9 ? '9+' : String(n);
}

async function loadKomFeed(){
  const listEl = document.getElementById('komFeedList');
  if(!listEl) return;
  listEl.innerHTML = `<div class="viz-empty">Memuat kasus komunitas...</div>`;
  try{
    const cases = await komunitasFetchCases(komFilter);
    if(!cases.length){
      listEl.innerHTML = `<div class="empty-state"><h3 style="font-size:15px;">Belum ada kasus</h3><p>Jadi yang pertama membagikan pengalaman atau masalah bertani Anda.</p></div>`;
      return;
    }
    listEl.innerHTML = cases.map(c=> caseCardHtml(c)).join('');
    listEl.querySelectorAll('[data-case]').forEach(el=> el.addEventListener('click', ()=> openCaseDetailSheet(el.dataset.case)));

    listEl.innerHTML = `<div class="banner" style="border-color:#f0d3cc;background:#fbeae5;">${ICONS.info}<p>Gagal memuat: ${escapeHtml(err.message)}</p></div>`;

  document.getElementById('cancelReplyBtn')?.addEventListener('click', ()=>{ komReplyTarget = null; updateReplyIndicator(); });
}
function commentThreadHtml(comments){
  const top = comments.filter(cm=>!cm.parent_id);
  if(!top.length) return `<div class="hint">Belum ada komentar. Jadi yang pertama menanggapi.</div>`;
  const repliesOf = (id) => comments.filter(cm=>cm.parent_id===id);
  return top.map(cm=>{
    const replies = repliesOf(cm.id);
    return `<div class="comment-item">
      <div class="ci-top"><span class="ci-name">${escapeHtml(cm.profiles?cm.profiles.username:'Pengguna')}</span>${roleTagHtml(cm.profiles?cm.profiles.role:null)}<span class="ci-date">${fmtDateTimeShort(cm.created_at)}</span></div>
      <div class="ci-text">${escapeHtml(cm.isi)}</div>
      <button type="button" class="link-btn" data-reply-to="${cm.id}" style="font-size:11.5px;padding:2px 0;">Balas</button>
      ${replies.length? `<div class="comment-replies">${replies.map(r=>`
        <div class="comment-item reply">
          <div class="ci-top"><span class="ci-name">${escapeHtml(r.profiles?r.profiles.username:'Pengguna')}</span>${roleTagHtml(r.profiles?r.profiles.role:null)}<span class="ci-date">${fmtDateTimeShort(r.created_at)}</span></div>
          <div class="ci-text">${escapeHtml(r.isi)}</div>
        </div>`).join('')}</div>` : ''}
    </div>`;
  }).join('');
}
async function loadCaseComments(caseId){
  const el = document.getElementById('caseComments'); if(!el) return;
  try{
    const comments = await komunitasFetchComments(caseId);
    el.innerHTML = commentThreadHtml(comments);
    el.querySelectorAll('[data-reply-to]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const cm = comments.find(x=>x.id===btn.dataset.replyTo);
        komReplyTarget = cm ? { id: cm.id, username: cm.profiles?cm.profiles.username:'Pengguna' } : null;
        updateReplyIndicator();
        document.getElementById('fld_newComment')?.focus();
      });
    });
  }catch(err){
    el.innerHTML = `<div class="hint">Gagal memuat komentar: ${escapeHtml(err.message)}</div>`;
  }
}

/* ---- Form: bagikan / ubah kasus ---- */
function openCaseForm(existing){
  const fields = [
    { key:'judul', label:'Judul Kasus', type:'text', placeholder:'cth. Daun cabai keriting & kuning', required:true },
    { key:'kategori', label:'Kategori', type:'select', options: Object.entries(KATEGORI_KASUS).map(([value,label])=>({value,label})) },

    { key:'deskripsi_masalah', label:'Deskripsi Masalah / Pengalaman', type:'textarea', placeholder:'Ceritakan gejala atau masalah yang dialami...', required:true },
    { key:'solusi', label:'Solusi (opsional, isi jika sudah ketemu solusinya)', type:'textarea', placeholder:'Apa yang berhasil mengatasi masalah ini?' }
  ];
  let fotoDataUrl = existing ? (existing.foto||null) : null;
  const extra = `<div class="field"><label>Foto (opsional)</label>
    <div id="komFotoPreviewWrap">${fotoDataUrl?`<img src="${fotoDataUrl}" class="foto-preview" id="komFotoPreview">`:''}</div>

  </div>`;
  openFormSheet(existing?'Ubah Kasus':'Bagikan Kasus & Solusi', fields, existing||{}, (data)=>{
    const btn = sheetFoot.querySelector('.btn-primary');
    if(btn){ btn.textContent = 'Menyimpan...'; btn.disabled = true; }
    (async ()=>{
      try{
        const payload = { judul:data.judul.trim(), kategori:data.kategori, tanaman:data.tanaman.trim(), deskripsi_masalah:data.deskripsi_masalah.trim(), solusi:data.solusi.trim(), foto:fotoDataUrl };
        if(!payload.judul || !payload.deskripsi_masalah){ toast('Judul & deskripsi masalah wajib diisi'); if(btn){ btn.textContent='Simpan'; btn.disabled=false; } return; }
        if(existing) await komunitasUpdateCase(existing.id, payload);
        else await komunitasCreateCase(payload);
        toast('Kasus disimpan'); closeSheet(); loadKomFeed();
      }catch(err){ toast('Gagal: '+err.message); if(btn){ btn.textContent='Simpan'; btn.disabled=false; } }
    })();
    return false;
  }, null, null, extra);
  document.getElementById('fld_komFoto').addEventListener('change', async (e)=>{

    toast('Memproses foto...');

      fotoDataUrl = await resizeImageFile(file, 800, 0.68);
      document.getElementById('komFotoPreviewWrap').innerHTML = `<img src="${fotoDataUrl}" class="foto-preview" id="komFotoPreview">`;
      toast('Foto siap');
    }catch(err){ toast('Gagal memproses foto'); }
  });
}

/* ---- Profil pengguna (sheet) — kasus miliknya + ikuti/berhenti ikuti ---- */

function renderAnalisis(){
  const root = document.getElementById('view-analisis');
  if(!db.cycles.length){
    root.innerHTML = `<div class="empty-state card"><div class="glyph">${ICONS.chevron.replace('currentColor','#fff')}</div><h3>Belum ada data untuk dianalisis</h3><p>Tambahkan siklus tanam, aktivitas, dan hasil panen terlebih dahulu untuk melihat perbandingan dan efisiensi di sini.</p></div>`;
    return;
  }
  const fieldOpts = `<option value="">Semua Lahan</option>` + db.fields.map(f=>`<option value="${f.id}" ${analysisFilter.fieldId===f.id?'selected':''}>${escapeHtml(f.nama)}</option>`).join('');
  const statusOpts = `<option value="">Semua Status</option>` + Object.entries(STATUS_SIKLUS).map(([k,v])=>`<option value="${k}" ${analysisFilter.status===k?'selected':''}>${v}</option>`).join('');

  const finances = allCyclesFinance(analysisFilter.fieldId, analysisFilter.status);

  const byKategoriAgg = {};
  finances.forEach(f=> Object.entries(f.byKategori).forEach(([k,v])=> byKategoriAgg[k]=(byKategoriAgg[k]||0)+v));
  const kategoriRows = Object.entries(byKategoriAgg).sort((a,b)=>b[1]-a[1]).map(([k,v])=>({label:KATEGORI_BIAYA[k]||k, value:v}));

  const treatments = analyzeTreatments().filter(t=> !analysisFilter.fieldId || t.cycles.some(f=>f.cycle.fieldId===analysisFilter.fieldId));

  const filterLabel = [
    analysisFilter.fieldId ? (db.fields.find(f=>f.id===analysisFilter.fieldId)||{}).nama : 'Semua Lahan',
    analysisFilter.status ? STATUS_SIKLUS[analysisFilter.status] : 'Semua Status'
  ].join(' · ');

  root.innerHTML = `
    <div class="print-header">
      <h1>Catatan Tani — Laporan Analisis</h1>
      <div class="meta">Dicetak ${fmtDate(todayStr())} · Filter: ${escapeHtml(filterLabel)}</div>

      <div class="filter-row" style="flex:1;margin-bottom:0;">
        <select class="filter-select" id="anFilterField">${fieldOpts}</select>
        <select class="filter-select" id="anFilterStatus">${statusOpts}</select>
      </div>
      <button class="btn btn-outline btn-sm" id="printBtn" style="flex-shrink:0;">${ICONS.printer} Cetak</button>
    </div>

    <div class="section-title"><h3>Biaya vs Pendapatan vs Profit</h3></div>
    <div class="viz-card"><div class="viz-title">Perbandingan per Siklus</div><div class="viz-sub">${finances.length} siklus ditampilkan</div><div id="anChart1"></div></div>

    <div class="section-title"><h3>Rincian Biaya per Kategori</h3></div>
    <div class="viz-card"><div class="viz-title">Total biaya, semua siklus terpilih</div><div class="viz-sub">${fmtRp(kategoriRows.reduce((s,r)=>s+r.value,0))} total</div><div id="anChart2"></div></div>

    <div class="section-title"><h3>Efektivitas Perlakuan</h3><span class="muted" style="font-size:11.5px;color:var(--ink-mute);">berdasarkan tag "Perlakuan"</span></div>
    ${treatments.length ? `<div class="table-scroll"><table class="datatable"><thead><tr><th>Perlakuan</th><th>Jenis</th><th>Dipakai</th><th>Rata² Profit</th><th>Rata² Hasil/Ha</th></tr></thead><tbody>
      ${treatments.map(t=>`<tr><td>${escapeHtml(t.perlakuan)}</td><td>${JENIS_AKTIVITAS[t.jenis]||t.jenis}</td><td>${t.count}x siklus</td><td style="color:${t.avgProfit>=0?'var(--good)':'var(--bad)'};font-weight:700;">${fmtRp(t.avgProfit)}</td><td>${t.avgHasilPerHa!=null?fmtNum(t.avgHasilPerHa,0)+' kg':'-'}</td></tr>`).join('')}
    </tbody></table></div>` : `<div class="card card-pad" style="text-align:center;color:var(--ink-mute);font-size:12.5px;">Belum ada aktivitas yang diberi tag "Perlakuan". Isi kolom Perlakuan saat mencatat aktivitas (pemupukan, penyemprotan, dll) untuk membandingkan efektivitasnya di sini.</div>`}

    <div class="section-title"><h3>Ringkasan Semua Siklus</h3></div>
    <div class="table-scroll"><table class="datatable"><thead><tr><th>Lahan</th><th>Siklus</th><th>Status</th><th>Biaya</th><th>Pendapatan</th><th>Profit</th><th>ROI</th><th>Hasil/Ha</th><th>Biaya/Kg</th></tr></thead><tbody>

        <td>${f.hasilPerHa!=null?fmtNum(f.hasilPerHa,0):'-'}</td>
        <td>${f.biayaPerKg!=null?fmtRp(f.biayaPerKg):'-'}</td>

      { name:'Biaya', data: finances.map(f=>f.totalBiaya), color:'var(--viz-s1)' },

  document.getElementById('anFilterStatus').addEventListener('change', (e)=>{ analysisFilter.status=e.target.value; renderAnalisis(); });
  document.getElementById('printBtn').addEventListener('click', ()=> window.print());
}

/* ======================================================================
   VIEW: LAINNYA (settings)
   ====================================================================== */
function download(filename, content, mime){
  const blob = new Blob([content], {type:mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click();
  setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(url); }, 500);
}
function csvEscape(v){ v = String(v??''); if(/[",\n]/.test(v)) return '"'+v.replace(/"/g,'""')+'"'; return v; }
function toCsv(rows){ return rows.map(r=> r.map(csvEscape).join(',')).join('\r\n'); }

function exportJson(){
  download('catatan-tani-backup-'+todayStr()+'.json', JSON.stringify(db,null,2), 'application/json');
  toast('Cadangan JSON diunduh');
}
function exportCsvRingkasan(){
  const rows = [['Lahan','Komoditas','Varietas','Musim','Status','Tanggal Mulai','Biaya','Pendapatan','Profit','ROI %','Hasil/Ha (kg)','Biaya/Kg']];
  allCyclesFinance().forEach(f=> rows.push([f.field?f.field.nama:'', f.cycle.komoditas, f.cycle.varietas, f.cycle.musim, STATUS_SIKLUS[f.cycle.status], f.cycle.tanggalMulai, f.totalBiaya, f.totalPendapatan, f.profit, f.roi!=null?f.roi.toFixed(1):'', f.hasilPerHa!=null?f.hasilPerHa.toFixed(0):'', f.biayaPerKg!=null?f.biayaPerKg.toFixed(0):'']));
  download('ringkasan-siklus-'+todayStr()+'.csv', toCsv(rows), 'text/csv');
  toast('CSV ringkasan diunduh');
}
function exportCsvAktivitas(){
  const rows = [['Lahan','Siklus','Tanggal','Jenis Aktivitas','Perlakuan','Barang/Jasa Dipakai','Kategori','Jumlah','Satuan','Harga Satuan','Biaya','Catatan']];
  db.activities.forEach(a=>{
    const c = db.cycles.find(x=>x.id===a.cycleId); const f = c? db.fields.find(x=>x.id===c.fieldId):null;
    const base = [f?f.nama:'', c?c.komoditas+' '+c.musim:'', a.tanggal, JENIS_AKTIVITAS[a.jenis]||a.jenis, a.perlakuan];
    if((a.pemakaian||[]).length){
      a.pemakaian.forEach(p=> rows.push([...base, p.nama, KATEGORI_BIAYA[p.kategori]||p.kategori, p.jumlah, p.satuan, p.hargaSatuan, p.biaya, a.catatan]));
    } else {
      rows.push([...base, '', '', '', '', '', 0, a.catatan]);
    }
  });
  download('aktivitas-biaya-'+todayStr()+'.csv', toCsv(rows), 'text/csv');
  toast('CSV aktivitas diunduh');
}
function exportCsvPengadaan(){
  const rows = [['Nama','Kategori','Tanggal Beli','Jumlah Beli','Satuan','Harga Satuan','Total Beli','Terpakai','Sisa Stok','Catatan']];
  db.procurements.forEach(p=>{
    const u = procurementUsage(p.id);
    rows.push([p.nama, KATEGORI_BIAYA[p.kategori]||p.kategori, p.tanggal, p.jumlahBeli, p.satuan, p.hargaSatuan, p.jumlahBeli*p.hargaSatuan, u.terpakai, u.sisa, p.catatan]);
  });
  download('pengadaan-stok-'+todayStr()+'.csv', toCsv(rows), 'text/csv');
  toast('CSV pengadaan diunduh');
}
function exportCsvPanen(){
  const rows = [['Lahan','Siklus','Tanggal','Jumlah','Satuan','Kualitas','Harga Jual','Pendapatan']];
  db.harvests.forEach(h=>{
    const c = db.cycles.find(x=>x.id===h.cycleId); const f = c? db.fields.find(x=>x.id===c.fieldId):null;
    rows.push([f?f.nama:'', c?c.komoditas+' '+c.musim:'', h.tanggal, h.jumlah, h.satuanHasil, h.kualitas, h.hargaJual, h.jumlah*h.hargaJual]);
  });
  download('hasil-panen-'+todayStr()+'.csv', toCsv(rows), 'text/csv');
  toast('CSV panen diunduh');
}

function importJsonFile(file){
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const parsed = JSON.parse(e.target.result);
      if(!parsed || !Array.isArray(parsed.fields)) throw new Error('format tidak valid');
      confirmDialog('Timpa Semua Data?', 'Impor akan MENGGANTI seluruh data yang ada saat ini dengan isi file cadangan. Pastikan Anda sudah mengekspor data terkini jika perlu.', ()=>{
        db = parsed; if(!db.notes) db.notes=[]; save(); toast('Data berhasil diimpor'); renderCurrentView();
      }, 'Timpa Data');
    }catch(err){ toast('Gagal membaca file: format tidak dikenali'); }
  };
  reader.readAsText(file);
}

function refreshNotifStatus(){
  const el = document.getElementById('notifStatusText'); if(!el) return;
  const perm = notifPermission();
  const map = { granted:'Aktif — ketuk untuk uji coba', denied:'Ditolak — aktifkan lewat pengaturan browser', default:'Belum diaktifkan — ketuk untuk aktifkan', unsupported:'Tidak didukung browser ini' };
  el.textContent = map[perm] || perm;
}

/* ======================================================================

   ====================================================================== */
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault(); deferredPrompt = e;
  document.getElementById('installBtn').style.display = 'flex';
});
document.getElementById('installBtn').addEventListener('click', async ()=>{
  if(!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  document.getElementById('installBtn').style.display = 'none';
});
window.addEventListener('appinstalled', ()=>{ toast('Aplikasi terinstal di HP Anda'); });

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
