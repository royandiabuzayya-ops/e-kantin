<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Catatan Tani - Jurnal Pertanian</title>
<meta name="description" content="Catat aktivitas, biaya, dan hasil panen. Ketahui keuntungan sebenarnya dari setiap lahan dan musim tanam.">
<meta name="theme-color" content="#1f3d2e">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Catatan Tani">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============ Design tokens ============ */
:root{
  color-scheme: light;
  --paper:      #f6f1e4;
  --paper-2:    #efe7d3;
  --card:       #fffdf7;
  --card-soft:  #fbf6e9;
  --forest:     #1f3d2e;
  --forest-2:   #294f3c;
  --forest-3:   #14261c;
  --terracotta: #c1592c;
  --terracotta-dark:#a1481f;
  --gold:       #b8860b;
  --ink:        #241f16;
  --ink-soft:   #6b6153;
  --ink-mute:   #948a78;
  --line:       #e3d9c1;
  --line-strong:#d2c6a6;
  --good:       #2f6b3a;
  --good-bg:    #e6efe1;
  --bad:        #a8342a;
  --bad-bg:     #f5e5e0;
  --shadow-sm:  0 1px 2px rgba(36,31,22,0.08);
  --shadow-md:  0 6px 20px -6px rgba(36,31,22,0.25);
  --shadow-lg:  0 20px 45px -12px rgba(20,38,28,0.35);
  --radius-s:   10px;
  --radius-m:   16px;
  --radius-l:   24px;
  --font-display: 'Fraunces', Georgia, 'Times New Roman', serif;
  --font-body: 'Work Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;

  /* dataviz reference tokens — chart surfaces stay exactly to the validated palette */
  --viz-surface: #fcfcfb;
  --viz-text-primary: #0b0b0b;
  --viz-text-secondary: #52514e;
  --viz-text-muted: #898781;
  --viz-grid: #e1e0d9;
  --viz-baseline: #c3c2b7;
  --viz-s1: #2a78d6; /* blue */
  --viz-s2: #eb6834; /* orange */
  --viz-s3: #1baf7a; /* aqua */
  --viz-s4: #eda100; /* yellow */
  --viz-s5: #e87ba4; /* magenta */
  --viz-s6: #008300; /* green */
  --viz-s7: #4a3aa7; /* violet */
  --viz-s8: #e34948; /* red */
  --viz-good: #0ca30c;
  --viz-warning: #fab219;
  --viz-serious: #ec835a;
  --viz-critical: #d03b3b;
}

*{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
html,body{ height:100%; }
body{
  margin:0;
  background:
    radial-gradient(ellipse 900px 500px at 10% -10%, rgba(31,61,46,0.06), transparent 60%),
    var(--paper);
  color:var(--ink);
  font-family:var(--font-body);
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y: none;
}
img{ max-width:100%; display:block; }
button{ font-family:inherit; }
input,select,textarea{ font-family:inherit; font-size:16px; }
h1,h2,h3,h4{ font-family:var(--font-display); margin:0; color:var(--forest-3); font-weight:600; }
a{ color:inherit; }
::selection{ background: var(--terracotta); color:#fff; }

/* subtle grain texture overlay for the organic/editorial feel */
.grain{
  position:fixed; inset:0; pointer-events:none; z-index:0; opacity:0.035; mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
}

/* ============ App shell ============ */
#app{ position:relative; z-index:1; max-width:560px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; }

.topbar{
  position:sticky; top:0; z-index:20;
  background: linear-gradient(180deg, var(--forest) 0%, var(--forest-2) 100%);
  color:#f6f1e4;
  padding: calc(env(safe-area-inset-top, 0px) + 16px) 18px 16px;
  box-shadow: var(--shadow-md);
}
.topbar-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
.brand{ display:flex; align-items:center; gap:10px; }
.brand-mark{ width:34px; height:34px; border-radius:9px; background:var(--terracotta); display:flex; align-items:center; justify-content:center; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.15); flex-shrink:0; }
.brand-mark svg{ width:20px; height:20px; }
.brand-text h1{ font-size:19px; color:#fff; line-height:1.1; letter-spacing:0.2px; }
.brand-text span{ font-size:11.5px; color:#cfe0d3; letter-spacing:0.4px; text-transform:uppercase; }
.topbar-actions{ display:flex; gap:8px; }
.icon-btn{
  width:36px; height:36px; border-radius:10px; border:1px solid rgba(255,255,255,0.18);
  background:rgba(255,255,255,0.08); color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer;
}
.icon-btn svg{ width:18px; height:18px; }
.bell-badge{ position:absolute; top:-4px; right:-4px; min-width:16px; height:16px; padding:0 3px; border-radius:8px; background:var(--terracotta); color:#fff; font-size:10px; font-weight:700; display:flex; align-items:center; justify-content:center; border:2px solid var(--forest); }
.page-title-row{ margin-top:14px; display:flex; align-items:baseline; justify-content:space-between; gap:8px; }
.page-title-row h2{ color:#fff; font-size:24px; }
.page-sub{ color:#cfe0d3; font-size:12.5px; margin-top:2px; }

.views{ flex:1; padding: 16px 16px calc(96px + env(safe-area-inset-bottom, 0px)); }
.view{ display:none; animation: viewIn 0.28s ease; }
.view.active{ display:block; }
@keyframes viewIn{ from{ opacity:0; transform:translateY(6px);} to{ opacity:1; transform:none;} }

/* bottom nav */
.tabbar{
  position:fixed; left:0; right:0; bottom:0; z-index:30;
  max-width:560px; margin:0 auto;
  background:rgba(255,253,247,0.92); backdrop-filter:blur(10px);
  border-top:1px solid var(--line-strong);
  padding: 8px 3px calc(8px + env(safe-area-inset-bottom, 0px));
  display:flex; justify-content:space-between; gap:1px;
  box-shadow: 0 -8px 24px -12px rgba(20,38,28,0.25);
}
.tab-btn{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:2px;
  background:none; border:none; padding:6px 0; color:var(--ink-mute); cursor:pointer; border-radius:12px; min-width:0;
}
.tab-btn svg{ width:18px; height:18px; }
.tab-btn span{ font-size:8.6px; font-weight:600; letter-spacing:0.1px; white-space:nowrap; max-width:100%; overflow:hidden; text-overflow:ellipsis; }
.tab-btn.active{ color:var(--forest); }
.tab-btn.active .tab-dot{ opacity:1; transform:scale(1); }
.tab-dot{ width:4px; height:4px; border-radius:50%; background:var(--terracotta); opacity:0; transform:scale(0.5); transition:0.2s; position:absolute; margin-top:26px; }

/* ============ Reusable bits ============ */
.card{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius-m); box-shadow:var(--shadow-sm); }
.card-pad{ padding:16px; }
.section-title{ display:flex; align-items:center; justify-content:space-between; margin:22px 0 10px; }
.section-title h3{ font-size:15.5px; color:var(--forest-3); }
.section-title h3 .muted{ color:var(--ink-mute); font-weight:400; font-family:var(--font-body); font-size:12.5px; }
.link-btn{ background:none; border:none; color:var(--terracotta-dark); font-weight:600; font-size:13px; cursor:pointer; padding:4px 2px; }

.kpi-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.kpi{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius-m); padding:14px; box-shadow:var(--shadow-sm); position:relative; overflow:hidden; }
.kpi::after{ content:''; position:absolute; right:-18px; top:-18px; width:60px; height:60px; border-radius:50%; background:var(--paper-2); opacity:0.6; }
.kpi .label{ font-size:11.5px; color:var(--ink-soft); font-weight:600; text-transform:uppercase; letter-spacing:0.3px; position:relative; }
.kpi .value{ font-family:var(--font-display); font-size:21px; font-weight:600; margin-top:6px; color:var(--forest-3); position:relative; font-variant-numeric:tabular-nums; }
.kpi .value.good{ color:var(--good); }
.kpi .value.bad{ color:var(--bad); }
.kpi .sub{ font-size:11px; color:var(--ink-mute); margin-top:3px; }

.empty-state{ text-align:center; padding:38px 20px; }
.empty-state .glyph{ width:64px; height:64px; margin:0 auto 14px; border-radius:18px; background:var(--forest); display:flex; align-items:center; justify-content:center; }
.empty-state .glyph svg{ width:32px; height:32px; }
.empty-state h3{ font-size:18px; margin-bottom:6px; }
.empty-state p{ color:var(--ink-soft); font-size:13.5px; line-height:1.5; max-width:320px; margin:0 auto 16px; }

.btn{ display:inline-flex; align-items:center; justify-content:center; gap:7px; border-radius:12px; padding:12px 18px; font-weight:600; font-size:14.5px; border:1px solid transparent; cursor:pointer; }
.btn svg{ width:16px; height:16px; }
.btn-primary{ background:var(--forest); color:#fff; box-shadow:var(--shadow-sm); }
.btn-primary:active{ background:var(--forest-3); }
.btn-accent{ background:var(--terracotta); color:#fff; }
.btn-outline{ background:var(--card); border-color:var(--line-strong); color:var(--forest-3); }
.btn-ghost{ background:transparent; color:var(--ink-soft); }
.btn-danger{ background:var(--bad-bg); color:var(--bad); }
.btn-block{ width:100%; }
.btn-sm{ padding:8px 12px; font-size:13px; border-radius:10px; }
.fab{
  position:fixed; right:calc((100vw - 560px)/2 + 18px); bottom:calc(92px + env(safe-area-inset-bottom, 0px));
  width:56px; height:56px; border-radius:18px; background:var(--terracotta); color:#fff; border:none;
  box-shadow:0 10px 24px -6px rgba(193,89,44,0.55); display:flex; align-items:center; justify-content:center; z-index:25; cursor:pointer;
}
@media (max-width:559px){ .fab{ right:18px; } }
.fab svg{ width:24px; height:24px; }

.chip{ display:inline-flex; align-items:center; gap:5px; padding:5px 10px; border-radius:999px; font-size:11.5px; font-weight:600; border:1px solid transparent; }
.chip-berjalan{ background:#e7edf6; color:#33517d; }
.chip-panen_selesai{ background:var(--good-bg); color:var(--good); }
.chip-gagal{ background:var(--bad-bg); color:var(--bad); }

.list-item{ display:flex; align-items:center; gap:12px; padding:13px 14px; border-radius:14px; background:var(--card); border:1px solid var(--line); margin-bottom:9px; cursor:pointer; }
.list-item:active{ background:var(--card-soft); }
.li-icon{ width:40px; height:40px; border-radius:11px; background:var(--paper-2); display:flex; align-items:center; justify-content:center; flex-shrink:0; color:var(--forest); }
.li-icon svg{ width:19px; height:19px; }
.li-body{ flex:1; min-width:0; }
.li-title{ font-weight:600; font-size:14.5px; color:var(--forest-3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.li-sub{ font-size:12px; color:var(--ink-mute); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.li-trail{ text-align:right; flex-shrink:0; }
.li-trail .amt{ font-weight:700; font-size:13.5px; font-variant-numeric:tabular-nums; }
.li-trail .amt.good{ color:var(--good); }
.li-trail .amt.bad{ color:var(--bad); }
.li-chevron{ color:var(--ink-mute); flex-shrink:0; }
.li-chevron svg{ width:16px; height:16px; }

.filter-row{ display:flex; gap:8px; overflow-x:auto; padding-bottom:2px; margin-bottom:4px; scrollbar-width:none; }
.filter-row::-webkit-scrollbar{ display:none; }
.filter-select{ appearance:none; background:var(--card); border:1px solid var(--line-strong); border-radius:11px; padding:9px 30px 9px 12px; font-size:13px; font-weight:600; color:var(--forest-3); flex-shrink:0;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20' fill='%236b6153'><path d='M5.5 7.5l4.5 4 4.5-4z'/></svg>");
  background-repeat:no-repeat; background-position:right 10px center; background-size:13px;
}

.tag{ display:inline-block; padding:3px 9px; border-radius:8px; background:var(--paper-2); color:var(--ink-soft); font-size:11px; font-weight:600; margin:2px 4px 2px 0; }

.divider{ height:1px; background:var(--line); margin:14px 0; border:none; }

/* forms */
.field{ margin-bottom:14px; }
.field label{ display:block; font-size:12.5px; font-weight:600; color:var(--ink-soft); margin-bottom:6px; }
.field .hint{ font-size:11px; color:var(--ink-mute); margin-top:5px; }
.field input[type=text], .field input[type=number], .field input[type=date], .field select, .field textarea{
  width:100%; padding:11px 13px; border-radius:11px; border:1.5px solid var(--line-strong); background:#fff; color:var(--ink); outline:none;
}
.field input:focus, .field select:focus, .field textarea:focus{ border-color:var(--forest); box-shadow:0 0 0 3px rgba(31,61,46,0.12); }
.field textarea{ min-height:70px; resize:vertical; }
.field-row{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.field select{ appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20' fill='%236b6153'><path d='M5.5 7.5l4.5 4 4.5-4z'/></svg>");
  background-repeat:no-repeat; background-position:right 12px center; background-size:14px; padding-right:32px;
}

/* modal / sheet */
.overlay{ position:fixed; inset:0; background:rgba(20,20,15,0.5); z-index:50; display:none; align-items:flex-end; justify-content:center; }
.overlay.active{ display:flex; }
.sheet{ background:var(--paper); width:100%; max-width:560px; max-height:92vh; border-radius:22px 22px 0 0; display:flex; flex-direction:column; box-shadow:var(--shadow-lg); animation:sheetIn 0.24s ease; }
@keyframes sheetIn{ from{ transform:translateY(24px); opacity:0.4; } to{ transform:none; opacity:1; } }
.sheet-handle{ width:38px; height:4px; background:var(--line-strong); border-radius:99px; margin:10px auto 4px; }
.sheet-head{ display:flex; align-items:center; justify-content:space-between; padding:10px 18px 6px; }
.sheet-head h3{ font-size:18px; }
.sheet-body{ padding:14px 18px 20px; overflow-y:auto; }
.sheet-close{ width:30px; height:30px; border-radius:9px; border:none; background:var(--paper-2); display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink-soft); }
.sheet-close svg{ width:15px; height:15px; }
.sheet-foot{ padding:12px 18px calc(16px + env(safe-area-inset-bottom, 0px)); border-top:1px solid var(--line); display:flex; gap:10px; }

.item-row{ border:1px dashed var(--line-strong); border-radius:13px; padding:12px; margin-bottom:10px; position:relative; background:var(--card-soft); }
.item-row .rm-row{ position:absolute; top:8px; right:8px; width:26px; height:26px; border-radius:8px; background:#fff; border:1px solid var(--line-strong); display:flex; align-items:center; justify-content:center; color:var(--bad); cursor:pointer; }
.item-row .rm-row svg{ width:13px; height:13px; }
.item-total{ text-align:right; font-size:12.5px; color:var(--ink-soft); margin-top:6px; font-weight:600; }

.toast-wrap{ position:fixed; bottom:calc(88px + env(safe-area-inset-bottom, 0px)); left:0; right:0; z-index:80; display:flex; justify-content:center; pointer-events:none; }
.toast{ background:var(--forest-3); color:#fff; padding:11px 18px; border-radius:12px; font-size:13.5px; font-weight:600; box-shadow:var(--shadow-md); opacity:0; transform:translateY(10px); transition:0.25s; max-width:90%; text-align:center; }
.toast.show{ opacity:1; transform:none; }

.banner{ background:linear-gradient(120deg, #fff3e2, #fdeee0); border:1px solid #ecd9bd; border-radius:14px; padding:12px 14px; display:flex; gap:10px; align-items:flex-start; margin-bottom:16px; }
.banner svg{ width:18px; height:18px; color:var(--terracotta-dark); flex-shrink:0; margin-top:1px; }
.banner p{ font-size:12.5px; color:#6b4a2c; line-height:1.5; margin:0; }
.banner button{ background:none; border:none; color:var(--terracotta-dark); font-weight:700; font-size:11px; margin-top:6px; cursor:pointer; padding:0; }

.detail-hero{ border-radius:var(--radius-l); padding:18px; background:linear-gradient(135deg, var(--forest) 0%, var(--forest-2) 65%, var(--terracotta-dark) 160%); color:#fff; position:relative; overflow:hidden; }
.detail-hero::before{ content:''; position:absolute; inset:0; opacity:0.15; background-image:radial-gradient(circle at 20% 20%, #fff 0, transparent 3%), radial-gradient(circle at 80% 60%, #fff 0, transparent 3%); }
.detail-hero .eyebrow{ font-size:11px; text-transform:uppercase; letter-spacing:0.5px; color:#d9e6da; font-weight:700; }
.detail-hero h2{ color:#fff; font-size:22px; margin-top:4px; }
.detail-hero .meta{ font-size:12.5px; color:#dbe8dd; margin-top:5px; }
.detail-stat-row{ display:flex; gap:10px; margin-top:16px; }
.detail-stat{ flex:1; background:rgba(255,255,255,0.12); border-radius:12px; padding:10px; backdrop-filter:blur(4px); }
.detail-stat .l{ font-size:10.5px; text-transform:uppercase; letter-spacing:0.3px; color:#dbe8dd; }
.detail-stat .v{ font-family:var(--font-display); font-size:16.5px; font-weight:600; margin-top:3px; font-variant-numeric:tabular-nums; }

.subtabs{ display:flex; gap:6px; margin:16px 0 12px; background:var(--paper-2); padding:4px; border-radius:12px; }
.subtab{ flex:1 0 auto; min-width:64px; text-align:center; padding:8px 6px; border-radius:9px; font-size:12px; font-weight:600; color:var(--ink-soft); cursor:pointer; white-space:nowrap; }
.subtab.active{ background:var(--card); color:var(--forest-3); box-shadow:var(--shadow-sm); }

.pill-row{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; }
.pill{ padding:8px 13px; border-radius:11px; border:1.5px solid var(--line-strong); font-size:12.5px; font-weight:600; color:var(--ink-soft); background:#fff; cursor:pointer; }
.pill.active{ background:var(--forest); border-color:var(--forest); color:#fff; }

table.datatable{ width:100%; border-collapse:collapse; font-size:12.5px; }
table.datatable th{ text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:0.3px; color:var(--ink-mute); padding:8px 8px; border-bottom:1.5px solid var(--line-strong); white-space:nowrap; }
table.datatable td{ padding:9px 8px; border-bottom:1px solid var(--line); white-space:nowrap; font-variant-numeric:tabular-nums; }
table.datatable tr:last-child td{ border-bottom:none; }
.table-scroll{ overflow-x:auto; -webkit-overflow-scrolling:touch; border-radius:var(--radius-m); border:1px solid var(--line); background:var(--viz-surface); }
.table-scroll table.datatable{ min-width:640px; }

.settings-item{ display:flex; align-items:center; gap:12px; padding:14px; background:var(--card); border:1px solid var(--line); border-radius:14px; margin-bottom:9px; cursor:pointer; }
.settings-item .si-icon{ width:38px; height:38px; border-radius:10px; background:var(--paper-2); display:flex; align-items:center; justify-content:center; color:var(--forest); flex-shrink:0; }
.settings-item .si-icon svg{ width:18px; height:18px; }
.settings-item .si-title{ font-weight:600; font-size:14px; color:var(--forest-3); }
.settings-item .si-sub{ font-size:11.5px; color:var(--ink-mute); margin-top:1px; }

.viz-card{ background:var(--viz-surface); border:1px solid var(--line); border-radius:var(--radius-m); padding:16px 14px 10px; }
.viz-title{ font-size:13.5px; font-weight:700; color:var(--viz-text-primary); margin-bottom:2px; font-family:var(--font-body); }
.viz-sub{ font-size:11px; color:var(--viz-text-secondary); margin-bottom:10px; }
.viz-legend{ display:flex; flex-wrap:wrap; gap:10px; margin-top:8px; padding-top:8px; border-top:1px solid var(--viz-grid); }
.viz-legend-item{ display:flex; align-items:center; gap:6px; font-size:11px; color:var(--viz-text-secondary); font-weight:600; }
.viz-legend-swatch{ width:9px; height:9px; border-radius:2px; }
.viz-empty{ text-align:center; padding:22px 10px; color:var(--viz-text-secondary); font-size:12.5px; }

.swipe-actions{ display:flex; gap:8px; margin-top:2px; }

@media (min-width:420px){ .kpi-grid{ grid-template-columns:repeat(4,1fr);} }

/* ---- Rencana Kegiatan (planned tasks) ---- */
.plan-item{ display:flex; align-items:center; gap:12px; padding:13px 14px; border-radius:14px; background:var(--card); border:1px solid var(--line); margin-bottom:9px; }
.plan-item.due{ border-color:var(--terracotta); background:linear-gradient(120deg,#fff6ee,#fffdf7); }
.plan-due-badge{ font-size:10.5px; font-weight:700; padding:3px 8px; border-radius:7px; }

  { judul:'Kemungkinan Defisiensi Fosfor (P)', kata:['keunguan','ungu','pertumbuhan kerdil','akar tidak berkembang'], solusi:'Daun kemerahan/keunguan dengan pertumbuhan kerdil sering tanda kekurangan Fosfor, umum di tanah asam/dingin. Tambahkan pupuk SP-36 atau TSP. Pengapuran (dolomit) bisa membantu bila tanah terlalu asam.' },
  { judul:'Kemungkinan Kekurangan Air / Kekeringan', kata:['layu siang','layu siang hari','kering','tanah retak','daun menggulung siang'], solusi:'Jika tanaman layu di siang hari tapi segar kembali di pagi/malam, biasanya butuh pengairan lebih rutin. Tambah frekuensi penyiraman terutama di musim kemarau, dan pertimbangkan mulsa untuk menahan kelembapan tanah.' },
  { judul:'Kemungkinan Kelebihan Air / Akar Tergenang', kata:['tergenang','becek','akar busuk','banjir','drainase'], solusi:'Genangan air lama membuat akar kekurangan oksigen dan mudah busuk. Perbaiki saluran drainase agar air tidak menggenang lebih dari beberapa jam. Buat guludan/bedengan lebih tinggi bila lahan sering tergenang.' },
  { judul:'Kemungkinan Serangan Tikus', kata:['tikus','batang terpotong','tanaman roboh dipotong'], solusi:'Gunakan perangkap tikus atau umpan beracun sesuai anjuran di sekitar lahan (bukan pada tanaman). Bersihkan gulma/semak di pematang yang jadi sarang tikus. Koordinasi gropyokan bersama petani sekitar biasanya lebih efektif daripada sendirian.' }
];
function matchKb(deskripsi){
  const text = (deskripsi||'').toLowerCase();
  if(!text.trim()) return [];
  return KB_DIAGNOSA.map(entry=>{
    const score = entry.kata.reduce((s,k)=> s + (text.includes(k) ? 1 : 0), 0);
    return { ...entry, score };
  }).filter(e=>e.score>0).sort((a,b)=> b.score-a.score).slice(0,3);
}

const STORAGE_KEY = 'catatan_tani_db_v1';
let db = null;

function emptyDb(){
  return { fields:[], cycles:[], activities:[], harvests:[], notes:[], procurements:[], plans:[], diagnoses:[], meta:{ createdAt: Date.now() } };
}
function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    db = raw ? JSON.parse(raw) : emptyDb();
    if(!db.fields) db = emptyDb();
  }catch(e){ db = emptyDb(); }
  migrateIfNeeded();
}
// Migrate old schema (cost items embedded directly in activities) to the
// Pengadaan (procurement/stock) model: activities now log *what happened*,
// while cost is attributed by "using up" stock from a Pengadaan record.
function migrateIfNeeded(){
  if(!db.procurements) db.procurements = [];
  if(!db.notes) db.notes = [];
  if(!db.plans) db.plans = [];
  if(!db.diagnoses) db.diagnoses = [];
  let changed = false;
  db.activities.forEach(a=>{
    if(a.items && !a.pemakaian){
      a.pemakaian = a.items.map(it=>{
        const proc = { id:uid(), tanggal:a.tanggal, kategori:it.kategori||'lainnya', nama:it.deskripsi||(KATEGORI_BIAYA[it.kategori]||'Item'), jumlahBeli:Number(it.jumlah)||0, satuan:it.satuan||'', hargaSatuan:Number(it.hargaSatuan)||0, catatan:'Dibuat otomatis saat migrasi data lama', createdAt:a.createdAt||Date.now() };
        db.procurements.push(proc);
        return { id:uid(), procurementId:proc.id, nama:proc.nama, kategori:proc.kategori, jumlah:proc.jumlahBeli, satuan:proc.satuan, hargaSatuan:proc.hargaSatuan, biaya: proc.jumlahBeli*proc.hargaSatuan };
      });
      delete a.items;
      changed = true;
    }
    if(!a.pemakaian) a.pemakaian = [];
  });
  if(changed) save();
}
function save(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
}
function hasAnyData(){
  return db.fields.length || db.cycles.length || db.activities.length || db.harvests.length || db.notes.length || db.procurements.length || db.plans.length || db.diagnoses.length;
}

/* ---- CRUD helpers ---- */
function upsert(arr, obj){
  const i = arr.findIndex(x=>x.id===obj.id);
  if(i>=0) arr[i]=obj; else arr.unshift(obj);
}
function removeById(arr, id){
  const i = arr.findIndex(x=>x.id===id);
  if(i>=0) arr.splice(i,1);
}

function addOrUpdateField(data){
  const obj = { id:data.id||uid(), nama:data.nama.trim(), luas:Number(data.luas)||0, satuanLuas:data.satuanLuas||'ha', lokasi:(data.lokasi||'').trim(), jenisTanah:(data.jenisTanah||'').trim(), catatan:(data.catatan||'').trim(), createdAt:data.createdAt||Date.now() };
  upsert(db.fields, obj); save(); return obj;
}
function deleteField(id){
  const cycleIds = db.cycles.filter(c=>c.fieldId===id).map(c=>c.id);
  db.activities = db.activities.filter(a=>!cycleIds.includes(a.cycleId));
  db.harvests = db.harvests.filter(h=>!cycleIds.includes(h.cycleId));
  db.notes = db.notes.filter(n=> n.cycleId ? !cycleIds.includes(n.cycleId) : true);
  db.cycles = db.cycles.filter(c=>c.fieldId!==id);
  removeById(db.fields, id); save();
}

function addOrUpdateCycle(data){
  const obj = { id:data.id||uid(), fieldId:data.fieldId, musim:(data.musim||'').trim(), komoditas:(data.komoditas||'').trim(), varietas:(data.varietas||'').trim(), tanggalMulai:data.tanggalMulai||todayStr(), tanggalPanenTarget:data.tanggalPanenTarget||'', status:data.status||'berjalan', catatan:(data.catatan||'').trim(), createdAt:data.createdAt||Date.now() };
  upsert(db.cycles, obj); save(); return obj;
}
function deleteCycle(id){
  db.activities = db.activities.filter(a=>a.cycleId!==id);
  db.harvests = db.harvests.filter(h=>h.cycleId!==id);
  db.notes = db.notes.filter(n=>n.cycleId!==id);
  removeById(db.cycles, id); save();
}

function addOrUpdateActivity(data){
  // pemakaian: [{procurementId, jumlah}] — nama/kategori/satuan/hargaSatuan/biaya are
  // snapshotted from the referenced Pengadaan record at save time, so historical cost
  // stays accurate even if that Pengadaan is later edited or removed.
  const pemakaian = (data.pemakaian||[]).filter(p=>p.procurementId).map(p=>{
    const proc = db.procurements.find(x=>x.id===p.procurementId);
    const jumlah = Number(p.jumlah)||0;
    const hargaSatuan = proc ? proc.hargaSatuan : Number(p.hargaSatuan)||0;
    return {
      id: p.id||uid(), procurementId: p.procurementId,
      nama: proc ? proc.nama : (p.nama||'Item'), kategori: proc ? proc.kategori : (p.kategori||'lainnya'),
      satuan: proc ? proc.satuan : (p.satuan||''), jumlah, hargaSatuan, biaya: jumlah*hargaSatuan
    };
  });
  const obj = { id:data.id||uid(), cycleId:data.cycleId, jenis:data.jenis||'lainnya', tanggal:data.tanggal||todayStr(), perlakuan:(data.perlakuan||'').trim(), catatan:(data.catatan||'').trim(), pemakaian, createdAt:data.createdAt||Date.now() };
  upsert(db.activities, obj); save(); return obj;
}
function deleteActivity(id){ removeById(db.activities, id); save(); }

/* ---- Pengadaan (procurement / stock) ---- */
function addOrUpdateProcurement(data){
  const obj = { id:data.id||uid(), tanggal:data.tanggal||todayStr(), kategori:data.kategori||'lainnya', nama:(data.nama||'').trim(), jumlahBeli:Number(data.jumlahBeli)||0, satuan:(data.satuan||'').trim(), hargaSatuan:Number(data.hargaSatuan)||0, catatan:(data.catatan||'').trim(), createdAt:data.createdAt||Date.now() };
  upsert(db.procurements, obj); save(); return obj;
}
function deleteProcurement(id){
  // Keep historical cost data on activities intact (nama/kategori/harga are already
  // snapshotted) — just detach the live link so stock math no longer counts it.
  db.activities.forEach(a=> (a.pemakaian||[]).forEach(p=>{ if(p.procurementId===id) p.procurementId=null; }));
  removeById(db.procurements, id); save();
}
function procurementUsage(procId){
  let terpakai = 0; const uses = [];
  db.activities.forEach(a=> (a.pemakaian||[]).forEach(p=>{
    if(p.procurementId===procId){ terpakai += p.jumlah; uses.push({activity:a, pemakaian:p}); }
  }));
  const proc = db.procurements.find(x=>x.id===procId);
  const jumlahBeli = proc ? proc.jumlahBeli : 0;
  uses.sort((a,b)=> b.activity.tanggal.localeCompare(a.activity.tanggal));
  return { terpakai, sisa: jumlahBeli - terpakai, jumlahBeli, uses };
}

/* ---- Rencana Kegiatan (planned tasks / reminders) ---- */
function addDays(dateStr, n){
  const d = new Date(dateStr+'T00:00:00'); d.setDate(d.getDate()+Number(n||0));
  return d.toISOString().slice(0,10);
}
function addOrUpdatePlan(data){
  const obj = {
    id: data.id||uid(), cycleId: data.cycleId||null, judul:(data.judul||'').trim(), jenis: data.jenis||'lainnya',
    tanggalMulai: data.tanggalMulai||todayStr(), recurrenceType: data.recurrenceType||'sekali',
    intervalHari: data.recurrenceType==='sekali' ? null : Number(data.intervalHari)||7,
    lastDoneDate: data.lastDoneDate||null, catatan:(data.catatan||'').trim(),
    status: data.status||'aktif', createdAt: data.createdAt||Date.now()
  };
  upsert(db.plans, obj); save(); return obj;
}
function deletePlan(id){ removeById(db.plans, id); save(); }
function planNextDue(plan){
  if(plan.status!=='aktif') return null;
  if(plan.recurrenceType==='sekali') return plan.lastDoneDate ? null : plan.tanggalMulai;
  const base = plan.lastDoneDate || plan.tanggalMulai;
  return plan.lastDoneDate ? addDays(base, plan.intervalHari) : base;
}
function markPlanDone(id){
  const plan = db.plans.find(x=>x.id===id); if(!plan) return;
  plan.lastDoneDate = todayStr();
  if(plan.recurrenceType==='sekali') plan.status = 'selesai';
  save();
}
function planLabelRecurrence(plan){
  return plan.recurrenceType==='sekali' ? 'Sekali' : `Tiap ${plan.intervalHari} hari`;
}
function getPlansWithDue(cycleId){
  let list = db.plans.filter(p=> cycleId===undefined ? true : p.cycleId===cycleId);
  return list.map(p=> ({ plan:p, due: planNextDue(p) })).sort((a,b)=> {
    if(a.due && b.due) return a.due.localeCompare(b.due);
    if(a.due) return -1; if(b.due) return 1;
    return (b.plan.createdAt||0)-(a.plan.createdAt||0);
  });
}
function getDuePlans(){
  const today = todayStr();
  return getPlansWithDue().filter(x=> x.due && x.due<=today);
}
function getUpcomingPlans(days){
  const today = todayStr(); const horizon = addDays(today, days);
  return getPlansWithDue().filter(x=> x.due && x.due>today && x.due<=horizon);
}

/* ======================================================================
   NOTIFICATIONS (reminder for Rencana Kegiatan)
   — Best-effort only: this is a client-only app with no push server, so a
   reminder can only fire when the app is actually opened (foreground/loaded
   in background tab). There is no server to wake the phone while the app is
   fully closed. We're upfront about this in the Lainnya screen.
   ====================================================================== */
function notifSupported(){ return 'Notification' in window; }
function notifPermission(){ return notifSupported() ? Notification.permission : 'unsupported'; }
async function requestNotifPermission(){
  if(!notifSupported()){ toast('Browser ini tidak mendukung notifikasi'); return 'unsupported'; }
  const perm = await Notification.requestPermission();
  return perm;
}
async function fireReminderNotification(due, {force=false} = {}){
  if(!notifSupported() || Notification.permission!=='granted') return false;
  const today = todayStr();
  if(!force){
    if(localStorage.getItem('ct_last_notify_date')===today) return false;
  }
  const title = 'Catatan Tani';
  const body = due.length===1 ? `1 rencana jatuh tempo: ${due[0].plan.judul}` : `${due.length} rencana kegiatan jatuh tempo hari ini`;
  try{
    if('serviceWorker' in navigator){
      const reg = await navigator.serviceWorker.ready;
      await reg.showNotification(title, { body, icon:'icons/icon-192.png', badge:'icons/icon-192.png', tag:'ct-reminder' });
    } else {
      new Notification(title, { body, icon:'icons/icon-192.png' });
    }
    localStorage.setItem('ct_last_notify_date', today);
    return true;
  }catch(e){ return false; }
}
function checkAndNotifyDuePlans(){
  const due = getDuePlans();
  if(due.length) fireReminderNotification(due);
  return due;
}

/* ---- Pengaturan Diagnosa AI (disimpan terpisah dari db — tidak ikut ekspor JSON) ---- */
function getAiSettings(){
  return {
    apiKey: localStorage.getItem('ct_ai_key') || '',
    model: localStorage.getItem('ct_ai_model') || 'claude-3-5-sonnet-20241022'
  };
}
function saveAiSettings(apiKey, model){
  localStorage.setItem('ct_ai_key', apiKey||'');
  localStorage.setItem('ct_ai_model', model||'claude-3-5-sonnet-20241022');
}
async function askAiDiagnosis(diagnosis){
  const { apiKey, model } = getAiSettings();
  if(!apiKey) throw new Error('API key belum diisi');
  const promptText = `Saya petani kecil di Indonesia. Tolong bantu diagnosis masalah tanaman berikut dan berikan solusi praktis yang bisa dikerjakan petani kecil (bahan/metode yang mudah didapat). Jawab dalam Bahasa Indonesia, ringkas, dalam bentuk poin-poin: (1) Kemungkinan penyebab, (2) Langkah solusi.\n\nKategori masalah: ${KATEGORI_DIAGNOSA[diagnosis.kategori]||diagnosis.kategori}\nDeskripsi: ${diagnosis.deskripsi||'(tidak ada deskripsi)'}`;
  const content = [{ type:'text', text: promptText }];
  if(diagnosis.fotoDataUrl){
    const base64 = diagnosis.fotoDataUrl.split(',').pop();
    content.push({ type:'image', source:{ type:'base64', media_type:'image/jpeg', data: base64 } });
  }
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method:'POST',
    headers:{
      'content-type':'application/json',
      'x-api-key': apiKey,
      'anthropic-version':'2023-06-01',
      'anthropic-dangerous-direct-browser-access':'true'
    },
    body: JSON.stringify({ model, max_tokens:800, messages:[{ role:'user', content }] })
  });
  if(!res.ok){
    const errText = await res.text().catch(()=> '');
    throw new Error('Gagal menghubungi AI ('+res.status+'): '+errText.slice(0,200));
  }
  const json = await res.json();
  const text = (json.content||[]).map(c=>c.text).filter(Boolean).join('\n').trim();
  if(!text) throw new Error('AI tidak memberikan jawaban');
  return text;
}

/* ---- Foto: kompresi di sisi klien agar hemat penyimpanan lokal ---- */
function resizeImageFile(file, maxW=900, quality=0.72){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = ()=> reject(new Error('Gagal membaca file'));
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = ()=> reject(new Error('Gagal memuat gambar'));
      img.onload = ()=>{
        const scale = Math.min(1, maxW/img.width);
        const w = Math.round(img.width*scale), h = Math.round(img.height*scale);
        const canvas = document.createElement('canvas'); canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

   ANALYTICS
   ====================================================================== */
function luasHa(field){ if(!field) return 0; return field.satuanLuas==='m2' ? field.luas/10000 : field.luas; }

function cycleActivities(cycleId){ return db.activities.filter(a=>a.cycleId===cycleId).sort((a,b)=> b.tanggal.localeCompare(a.tanggal)); }
function cycleHarvests(cycleId){ return db.harvests.filter(h=>h.cycleId===cycleId).sort((a,b)=> b.tanggal.localeCompare(a.tanggal)); }
function cycleNotes(cycleId){ return db.notes.filter(n=>n.cycleId===cycleId).sort((a,b)=> b.tanggal.localeCompare(a.tanggal)); }

function cycleFinance(cycleId){
  const cycle = db.cycles.find(c=>c.id===cycleId);
  const field = cycle ? db.fields.find(f=>f.id===cycle.fieldId) : null;
  const acts = cycleActivities(cycleId);
  const harvests = cycleHarvests(cycleId);
  let totalBiaya = 0; const byKategori = {};
  acts.forEach(a=> (a.pemakaian||[]).forEach(p=>{ totalBiaya += p.biaya; byKategori[p.kategori] = (byKategori[p.kategori]||0) + p.biaya; }));
  let totalPendapatan = 0, totalHasilKg = 0, hasKgUnit = false, totalHasilRaw = 0, rawUnitLabel = '';
  harvests.forEach(h=>{
    totalPendapatan += h.jumlah * h.hargaJual;
    if(KG_EQUIV[h.satuanHasil]){ totalHasilKg += h.jumlah * KG_EQUIV[h.satuanHasil]; hasKgUnit = true; }
    else { totalHasilRaw += h.jumlah; rawUnitLabel = h.satuanHasil; }
  });
  const profit = totalPendapatan - totalBiaya;
  const ha = luasHa(field);
  return {
    cycle, field, totalBiaya, totalPendapatan, profit, byKategori,
    totalHasilKg, hasKgUnit, totalHasilRaw, rawUnitLabel,
    biayaPerKg: (hasKgUnit && totalHasilKg>0) ? totalBiaya/totalHasilKg : null,
    roi: totalBiaya>0 ? (profit/totalBiaya*100) : null,
    hasilPerHa: (ha>0 && hasKgUnit) ? totalHasilKg/ha : null,
    profitPerHa: ha>0 ? profit/ha : null,
    ha, jumlahAktivitas: acts.length, jumlahPanen: harvests.length
  };
}

function allCyclesFinance(filterFieldId, filterStatus){
  return db.cycles
    .filter(c=> (!filterFieldId || c.fieldId===filterFieldId) && (!filterStatus || c.status===filterStatus))
    .map(c=> cycleFinance(c.id))
    .sort((a,b)=> (b.cycle.tanggalMulai||'').localeCompare(a.cycle.tanggalMulai||''));
}

function analyzeTreatments(){
  const groups = {};
  db.activities.forEach(a=>{
    if(!a.perlakuan) return;
    const key = a.jenis + '||' + a.perlakuan.toLowerCase();
    if(!groups[key]) groups[key] = { jenis:a.jenis, perlakuan:a.perlakuan, cycleIds:new Set() };
    groups[key].cycleIds.add(a.cycleId);
  });
  return Object.values(groups).map(g=>{
    const finances = [...g.cycleIds].map(id=>cycleFinance(id)).filter(f=>f.cycle);
    const n = finances.length || 1;
    const avgProfit = finances.reduce((s,f)=>s+f.profit,0)/n;
    const hasilVals = finances.filter(f=>f.hasilPerHa!=null).map(f=>f.hasilPerHa);
    const avgHasilPerHa = hasilVals.length ? hasilVals.reduce((s,v)=>s+v,0)/hasilVals.length : null;
    return { ...g, count:finances.length, avgProfit, avgHasilPerHa, cycles:finances };
  }).sort((a,b)=> b.avgProfit - a.avgProfit);
}

/* ======================================================================
   SVG BAR CHART (dataviz-skill compliant, self-contained, no deps)
   ====================================================================== */
function svgEl(tag, attrs){
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for(const k in attrs) el.setAttribute(k, attrs[k]);
  return el;
}

// Grouped / single bar chart with a zero baseline (supports negative values -> diverging).
function renderBarChart(container, opts){
  const { categories, series, formatValue=fmtNum, height=220, diverging=false } = opts;
  container.innerHTML = '';
  if(!categories.length || !series.length){
    container.innerHTML = '<div class="viz-empty">Belum ada data untuk ditampilkan.</div>';
    return;
  }
  const W = container.clientWidth || 320;
  const H = height;
  const padL = 8, padR = 8, padTop = 14, padBottom = 26;
  const plotW = W - padL - padR;
  const plotH = H - padTop - padBottom;

  let min = 0, max = 0;
  categories.forEach((c,ci)=> series.forEach(s=>{ const v = s.data[ci]||0; if(v<min)min=v; if(v>max)max=v; }));
  if(max===0 && min===0) max = 1;
  const range = (max - min) || 1;
  const zeroY = padTop + plotH * (max/range);
  const yScale = (v) => padTop + plotH * ((max - v)/range);

  const svg = svgEl('svg', { viewBox:`0 0 ${W} ${H}`, width:'100%', height:H, style:'display:block;overflow:visible' });

  // gridlines (recessive)
  const gridCount = 4;
  for(let i=0;i<=gridCount;i++){
    const v = min + (range * i/gridCount);
    const y = yScale(v);
    svg.appendChild(svgEl('line', { x1:padL, x2:W-padR, y1:y, y2:y, stroke:'var(--viz-grid)', 'stroke-width':1 }));
  }
  // baseline (zero) emphasized if diverging or min<0
  if(min < 0){
    svg.appendChild(svgEl('line', { x1:padL, x2:W-padR, y1:zeroY, y2:zeroY, stroke:'var(--viz-baseline)', 'stroke-width':1.4 }));
  }

  const groupW = plotW / categories.length;
  const barGap = 2;
  const nSeries = series.length;
  const maxBarW = 26;
  let barW = Math.min(maxBarW, (groupW - 14) / nSeries - barGap);
  if(barW < 3) barW = 3;
  const groupInnerW = barW*nSeries + barGap*(nSeries-1);

  categories.forEach((cat, ci)=>{
    const groupX0 = padL + groupW*ci + (groupW - groupInnerW)/2;
    series.forEach((s, si)=>{
      const v = s.data[ci] || 0;
      const x = groupX0 + si*(barW+barGap);
      const y0 = yScale(0), y1 = yScale(v);
      const barY = Math.min(y0,y1), barH = Math.max(1, Math.abs(y1-y0));
      let color = s.color;
      if(diverging) color = v < 0 ? 'var(--viz-critical)' : 'var(--viz-s1)';
      const rect = svgEl('rect', { x, y:barY, width:barW, height:barH, rx:Math.min(4,barW/2), fill:color });
      const title = svgEl('title', {});
      title.textContent = `${cat} — ${s.name}: ${formatValue(v)}`;
      rect.appendChild(title);
      svg.appendChild(rect);
    });
    // category label
    const lbl = svgEl('text', { x:groupX0 + groupInnerW/2, y:H-8, 'text-anchor':'middle', 'font-size':'9.5', fill:'var(--viz-text-muted)', 'font-family':'var(--font-body)' });
    lbl.textContent = cat.length > 10 ? cat.slice(0,9)+'…' : cat;
    svg.appendChild(lbl);
  });

  container.appendChild(svg);

  if(!diverging && series.length <= 3){
    const legend = document.createElement('div'); legend.className='viz-legend';
    series.forEach(s=>{
      const it = document.createElement('div'); it.className='viz-legend-item';
      it.innerHTML = `<span class="viz-legend-swatch" style="background:${s.color}"></span>${escapeHtml(s.name)}`;
      legend.appendChild(it);
    });
    container.appendChild(legend);
  } else if(diverging){
    const legend = document.createElement('div'); legend.className='viz-legend';
    legend.innerHTML = `<div class="viz-legend-item"><span class="viz-legend-swatch" style="background:var(--viz-s1)"></span>Untung</div><div class="viz-legend-item"><span class="viz-legend-swatch" style="background:var(--viz-critical)"></span>Rugi</div>`;
    container.appendChild(legend);
  }
}

// Horizontal bar for categorical breakdown (e.g. cost by category) with direct labels.
function renderHBarChart(container, opts){
  const { rows, formatValue=fmtNum, colors } = opts; // rows: [{label, value}]
  container.innerHTML = '';
  const filtered = rows.filter(r=>r.value>0);
  if(!filtered.length){ container.innerHTML = '<div class="viz-empty">Belum ada data biaya.</div>'; return; }
  const max = Math.max(...filtered.map(r=>r.value));
  const wrap = document.createElement('div');
  wrap.style.display='flex'; wrap.style.flexDirection='column'; wrap.style.gap='10px';
  filtered.forEach((r,i)=>{
    const pct = max>0 ? (r.value/max*100) : 0;
    const row = document.createElement('div');
    const color = colors[i % colors.length];
    row.innerHTML = `
      <div style="display:flex;justify-content:space-between;font-size:11.5px;margin-bottom:4px;">
        <span style="color:var(--viz-text-secondary);font-weight:600;">${escapeHtml(r.label)}</span>
        <span style="color:var(--viz-text-primary);font-weight:700;font-variant-numeric:tabular-nums;">${formatValue(r.value)}</span>
      </div>
      <div style="height:10px;border-radius:5px;background:var(--viz-grid);overflow:hidden;">
        <div style="height:100%;width:${pct}%;background:${color};border-radius:5px;"></div>
      </div>`;
    wrap.appendChild(row);
  });
  container.appendChild(wrap);
}

/* ======================================================================
   GENERIC FORM BUILDER
   ====================================================================== */
function buildFieldHtml(f, values){
  const val = values && values[f.key] !== undefined ? values[f.key] : (f.default ?? '');
  const req = f.required ? 'required' : '';
  let inner = '';
  if(f.type === 'select'){
    inner = `<select id="fld_${f.key}" ${req}>` + f.options.map(o=>`<option value="${escapeHtml(o.value)}" ${o.value===val?'selected':''}>${escapeHtml(o.label)}</option>`).join('') + `</select>`;
  } else if(f.type === 'textarea'){
    inner = `<textarea id="fld_${f.key}" placeholder="${escapeHtml(f.placeholder||'')}" ${req}>${escapeHtml(val)}</textarea>`;
  } else {
    inner = `<input type="${f.type}" id="fld_${f.key}" value="${escapeHtml(val)}" placeholder="${escapeHtml(f.placeholder||'')}" ${f.step?`step="${f.step}"`:''} ${req}>`;
  }
  return `<div class="field"><label>${escapeHtml(f.label)}</label>${inner}${f.hint?`<div class="hint">${escapeHtml(f.hint)}</div>`:''}</div>`;
}
function readFieldValue(f){
  const el = document.getElementById('fld_'+f.key);
  if(!el) return f.default ?? '';
  return el.value;
}

/* ======================================================================
   MODAL / SHEET
   ====================================================================== */
const overlay = document.getElementById('overlay');
const sheetTitle = document.getElementById('sheetTitle');
const sheetBody = document.getElementById('sheetBody');
const sheetFoot = document.getElementById('sheetFoot');

function closeSheet(){ overlay.classList.remove('active'); sheetBody.innerHTML=''; sheetFoot.innerHTML=''; }
document.getElementById('sheetClose').addEventListener('click', closeSheet);
overlay.addEventListener('click', (e)=>{ if(e.target===overlay) closeSheet(); });

function openSheet(title, bodyHtml, footButtons){
  sheetTitle.textContent = title;
  sheetBody.innerHTML = bodyHtml;
  sheetFoot.innerHTML = '';
  footButtons.forEach(b=>{
    const btn = document.createElement('button');
    btn.className = 'btn ' + (b.cls||'btn-outline') + ' ' + (b.block!==false?'btn-block':'');
    btn.innerHTML = b.label;
    btn.addEventListener('click', b.onClick);
    sheetFoot.appendChild(btn);
  });
  overlay.classList.add('active');
}

function confirmDialog(title, message, onConfirm, confirmLabel='Hapus'){
  openSheet(title, `<p style="color:var(--ink-soft);font-size:14px;line-height:1.6;">${escapeHtml(message)}</p>`, [
    { label:'Batal', cls:'btn-ghost', onClick: closeSheet },
    { label:confirmLabel, cls:'btn-danger', onClick: ()=>{ onConfirm(); closeSheet(); } }
  ]);
}

/* ---- Simple entity form sheet ---- */
function openFormSheet(title, fields, values, onSave, extraBodyHtml, onDelete, trailingHtml){
  const html = (extraBodyHtml||'') + fields.map(f=>buildFieldHtml(f, values||{})).join('') + (trailingHtml||'');
  const buttons = [];
  if(onDelete){ buttons.push({ label:'Hapus', cls:'btn-danger', block:false, onClick: onDelete }); }
  buttons.push({ label:'Batal', cls:'btn-ghost', block:false, onClick: closeSheet });
  buttons.push({ label:'Simpan', cls:'btn-primary', onClick: ()=>{
    const data = {}; fields.forEach(f=> data[f.key] = readFieldValue(f));
    if(values && values.id) data.id = values.id;
    const ok = onSave(data);
    if(ok!==false){ closeSheet(); }
  }});
  openSheet(title, html, buttons);
}

function updateBellBadge(){

  if(!badge) return;
  const n = getDuePlans().length;
  badge.style.display = n>0 ? 'flex' : 'none';
  badge.textContent = n>9 ? '9+' : String(n);
}
function planContextLabel(plan){
  if(!plan.cycleId) return 'Umum';
  const c = db.cycles.find(x=>x.id===plan.cycleId);
  if(!c) return 'Umum';
  const f = db.fields.find(x=>x.id===c.fieldId);
  return `${c.komoditas}${f?' · '+f.nama:''}`;
}
function planDueBadgeHtml(due){
  const today = todayStr();
  if(!due) return `<span class="plan-due-badge done">Selesai</span>`;
  if(due<today) return `<span class="plan-due-badge overdue">Terlewat</span>`;
  if(due===today) return `<span class="plan-due-badge today">Hari Ini</span>`;
  return `<span class="plan-due-badge upcoming">${fmtDateShort(due)}</span>`;
}
function planRowHtml(plan, due, opts){
  opts = opts || {};
  return `<div class="plan-item ${due && due<=todayStr()?'due':''}" data-plan="${plan.id}">
    <div class="li-icon">${ICONS[ACT_ICON[plan.jenis]]||ICONS.calendar}</div>
    <div class="li-body">
      <div class="li-title">${escapeHtml(plan.judul)}</div>
      <div class="li-sub">${opts.hideContext?'':escapeHtml(planContextLabel(plan))+' · '}${planLabelRecurrence(plan)}</div>
    </div>
    <div style="display:flex;align-items:center;gap:8px;">
      ${planDueBadgeHtml(due)}
      ${due ? `<button type="button" class="mini-btn" data-done="${plan.id}" title="Tandai selesai">${ICONS.check}</button>` : ''}
    </div>
  </div>`;
}

/* ======================================================================
   VIEW: DASHBOARD
   ====================================================================== */
function renderDashboard(){
  const root = document.getElementById('view-dashboard');
  if(!hasAnyData()){
    root.innerHTML = `
      <div class="empty-state card" style="padding:40px 20px;">
        <div class="glyph">${ICONS.seed.replace('currentColor','#fff')}</div>
        <h3>Mulai catat usaha tani Anda</h3>
        <p>Tambahkan lahan pertama Anda, lalu buat siklus tanam untuk mulai mencatat biaya, aktivitas, dan hasil panen.</p>
        <button class="btn btn-primary" id="dashAddField">+ Tambah Lahan Pertama</button>
        <div style="margin-top:10px;">
          <button class="link-btn" id="dashSeed">Atau muat data contoh untuk eksplorasi</button>
        </div>
      </div>`;
    document.getElementById('dashAddField').addEventListener('click', openFieldForm);
    document.getElementById('dashSeed').addEventListener('click', ()=>{ seedSampleData(); renderCurrentView(); });
    return;
  }

  const finances = allCyclesFinance();
  const totalBiaya = finances.reduce((s,f)=>s+f.totalBiaya,0);
  const totalPendapatan = finances.reduce((s,f)=>s+f.totalPendapatan,0);
  const profit = totalPendapatan - totalBiaya;
  const aktif = db.cycles.filter(c=>c.status==='berjalan').length;

  const top = finances.slice(0,6).reverse();

  // recent feed
  const feed = [];
  db.activities.forEach(a=>{ const c=db.cycles.find(x=>x.id===a.cycleId); feed.push({date:a.tanggal, type:'act', label:JENIS_AKTIVITAS[a.jenis]||a.jenis, sub:(c?c.komoditas+' · ':'')+ (db.fields.find(f=>f.id===(c||{}).fieldId)||{}).nama, amt: (a.pemakaian||[]).reduce((s,p)=>s+p.biaya,0), cycleId:a.cycleId}); });
  db.harvests.forEach(h=>{ const c=db.cycles.find(x=>x.id===h.cycleId); feed.push({date:h.tanggal, type:'harvest', label:'Panen '+fmtNum(h.jumlah)+' '+h.satuanHasil, sub:(c?c.komoditas:''), amt: h.jumlah*h.hargaJual, good:true, cycleId:h.cycleId}); });
  feed.sort((a,b)=> b.date.localeCompare(a.date));
  const recent = feed.slice(0,5);

  root.innerHTML = `
    <div class="banner" id="localWarnBanner" style="display:${localStorage.getItem('ct_hide_banner')?'none':'flex'}">
      ${ICONS.info}
      <p>Data disimpan <b>hanya di HP ini</b>. Jangan lupa ekspor cadangan secara berkala lewat tab <b>Lainnya</b>.
      <button id="dismissBanner">Mengerti, sembunyikan</button></p>
    </div>

    <div class="kpi-grid">
      <div class="kpi"><div class="label">Total Biaya</div><div class="value">${fmtRp(totalBiaya)}</div></div>
      <div class="kpi"><div class="label">Total Pendapatan</div><div class="value">${fmtRp(totalPendapatan)}</div></div>
      <div class="kpi"><div class="label">Profit Bersih</div><div class="value ${profit>=0?'good':'bad'}">${fmtRp(profit)}</div></div>
      <div class="kpi"><div class="label">Siklus Aktif</div><div class="value">${aktif}</div><div class="sub">dari ${db.cycles.length} total siklus</div></div>
    </div>

    <div id="dashReminders"></div>

    <div class="card card-pad" style="display:flex;align-items:center;gap:12px;margin-top:4px;background:linear-gradient(120deg,#fdeee0,#fff6ee);border-color:#ecd9bd;" id="dashDiagCard">
      <div class="li-icon" style="background:#fff;">${ICONS.camera}</div>
      <div style="flex:1;"><div style="font-weight:700;font-size:13.5px;color:var(--forest-3);">Tanaman terlihat bermasalah?</div><div style="font-size:11.5px;color:var(--ink-soft);margin-top:1px;">Ajukan masalah + foto, cari kemungkinan solusi</div></div>
      <button class="btn btn-accent btn-sm" id="dashDiagBtn" style="flex-shrink:0;">Cek</button>
    </div>

    <div class="section-title"><h3>Profit per Siklus Tanam <span class="muted">· 6 terbaru</span></h3></div>
    <div class="viz-card"><div id="dashChart"></div></div>

    <div class="section-title"><h3>Aktivitas Terbaru</h3><button class="link-btn" data-goto="musim">Lihat semua →</button></div>
    <div id="dashFeed"></div>
  `;

  const due = getDuePlans();
  const remRoot = document.getElementById('dashReminders');
  if(due.length){
    remRoot.innerHTML = `
      <div class="section-title" style="margin-top:18px;"><h3>Rencana Jatuh Tempo <span class="muted">· ${due.length}</span></h3><button class="link-btn" id="dashOpenReminders">Lihat semua</button></div>
      ${due.slice(0,3).map(x=> planRowHtml(x.plan, x.due)).join('')}
    `;
    bindPlanRowEvents(remRoot, ()=> renderDashboard());
    document.getElementById('dashOpenReminders').addEventListener('click', openReminderSheet);
  }

  renderBarChart(document.getElementById('dashChart'), {
    categories: top.map(f=> f.cycle.komoditas + ' · ' + (f.field?f.field.nama:'')),
    series: [{ name:'Profit', data: top.map(f=>f.profit), color:'var(--viz-s1)' }],
    diverging: true, formatValue: fmtRp
  });

  const feedRoot = document.getElementById('dashFeed');
  if(!recent.length){
    feedRoot.innerHTML = `<div class="card card-pad" style="text-align:center;color:var(--ink-mute);font-size:13px;">Belum ada aktivitas tercatat.</div>`;
  } else {
    feedRoot.innerHTML = recent.map(r=>`
      <div class="list-item" data-goto-cycle="${r.cycleId}">
        <div class="li-icon">${ICONS[r.type==='harvest'?'harvest':(ACT_ICON[r.label]||'note')] || ICONS.note}</div>
        <div class="li-body"><div class="li-title">${escapeHtml(r.label)}</div><div class="li-sub">${escapeHtml(r.sub||'')} · ${fmtDateShort(r.date)}</div></div>
        <div class="li-trail"><div class="amt ${r.good?'good':''}">${r.good?'+':''}${fmtRp(r.amt)}</div></div>
      </div>`).join('');
  }

  document.getElementById('dismissBanner')?.addEventListener('click', ()=>{ localStorage.setItem('ct_hide_banner','1'); document.getElementById('localWarnBanner').style.display='none'; });
  document.getElementById('dashDiagBtn').addEventListener('click', ()=> openDiagnosisForm(null));
  root.querySelectorAll('[data-goto]').forEach(b=> b.addEventListener('click', ()=> switchTab(b.dataset.goto)));
  root.querySelectorAll('[data-goto-cycle]').forEach(b=> b.addEventListener('click', ()=> openCycleDetail(b.dataset.gotoCycle)));
}

/* ======================================================================
   VIEW: LAHAN
   ====================================================================== */
function fieldStatsHtml(f){
  const cycles = db.cycles.filter(c=>c.fieldId===f.id);
  const fin = cycles.reduce((acc,c)=>{ const x=cycleFinance(c.id); acc.biaya+=x.totalBiaya; acc.pendapatan+=x.totalPendapatan; return acc; }, {biaya:0,pendapatan:0});
  const profit = fin.pendapatan - fin.biaya;
  return {cycles: cycles.length, profit};
}

function renderLahan(){
  const root = document.getElementById('view-lahan');
  let html = `<button class="btn btn-primary btn-block" id="addFieldBtn" style="margin-bottom:16px;">+ Tambah Lahan Baru</button>`;
  if(!db.fields.length){
    html += `<div class="empty-state card"><div class="glyph">${ICONS.plot.replace('currentColor','#fff')}</div><h3>Belum ada lahan</h3><p>Tambahkan lahan/petak pertama untuk mulai mencatat siklus tanam di dalamnya.</p></div>`;
  } else {
    html += db.fields.map(f=>{
      const s = fieldStatsHtml(f);
      return `<div class="list-item" data-field="${f.id}">
        <div class="li-icon">${ICONS.plot}</div>
        <div class="li-body"><div class="li-title">${escapeHtml(f.nama)}</div><div class="li-sub">${fmtNum(f.luas,2)} ${f.satuanLuas} · ${s.cycles} siklus${f.lokasi?' · '+escapeHtml(f.lokasi):''}</div></div>
        <div class="li-trail"><div class="amt ${s.profit>=0?'good':'bad'}">${fmtRp(s.profit)}</div><div style="font-size:10px;color:var(--ink-mute);">total profit</div></div>
      </div>`;
    }).join('');
  }
  root.innerHTML = html;
  document.getElementById('addFieldBtn').addEventListener('click', ()=>openFieldForm());
  root.querySelectorAll('[data-field]').forEach(el=> el.addEventListener('click', ()=> openFieldForm(el.dataset.field)));
}

function openFieldForm(id){
  const f = id ? db.fields.find(x=>x.id===id) : null;
  const fields = [
    { key:'nama', label:'Nama Lahan', type:'text', required:true, placeholder:'cth. Sawah Blok Utara' },
    { key:'luas', label:'Luas', type:'number', step:'0.01', required:true, placeholder:'0.5' },
    { key:'satuanLuas', label:'Satuan Luas', type:'select', options:[{value:'ha',label:'Hektare (ha)'},{value:'m2',label:'Meter persegi (m²)'}] },
    { key:'lokasi', label:'Lokasi (opsional)', type:'text', placeholder:'cth. Dekat sungai, RT 03' },
    { key:'jenisTanah', label:'Jenis Tanah (opsional)', type:'text', placeholder:'cth. Lempung berpasir' },
    { key:'catatan', label:'Catatan (opsional)', type:'textarea' }
  ];
  openFormSheet(f?'Ubah Lahan':'Tambah Lahan', fields, f, (data)=>{
    if(!data.nama.trim()){ toast('Nama lahan wajib diisi'); return false; }
    addOrUpdateField(data); toast('Lahan disimpan'); renderCurrentView();
  }, '', f ? ()=>{
    confirmDialog('Hapus Lahan?', `Menghapus "${f.nama}" juga akan menghapus semua siklus, aktivitas, dan panen di lahan ini. Tindakan ini tidak bisa dibatalkan.`, ()=>{ deleteField(f.id); toast('Lahan dihapus'); renderCurrentView(); });
  } : null);
}

/* ======================================================================
   VIEW: MUSIM (all cycles)
   ====================================================================== */
let musimFilter = { fieldId:'', status:'' };

function renderMusim(){
  const root = document.getElementById('view-musim');
  if(!db.fields.length){
    root.innerHTML = `<div class="empty-state card"><div class="glyph">${ICONS.seed.replace('currentColor','#fff')}</div><h3>Tambahkan lahan dulu</h3><p>Siklus tanam perlu terhubung ke sebuah lahan. Tambahkan lahan terlebih dahulu di tab Lahan.</p><button class="btn btn-primary" data-goto="lahan">Ke Tab Lahan</button></div>`;
    root.querySelector('[data-goto]').addEventListener('click', ()=>switchTab('lahan'));
    return;
  }
  const fieldOpts = `<option value="">Semua Lahan</option>` + db.fields.map(f=>`<option value="${f.id}" ${musimFilter.fieldId===f.id?'selected':''}>${escapeHtml(f.nama)}</option>`).join('');
  const statusOpts = `<option value="">Semua Status</option>` + Object.entries(STATUS_SIKLUS).map(([k,v])=>`<option value="${k}" ${musimFilter.status===k?'selected':''}>${v}</option>`).join('');

  let cycles = db.cycles.filter(c=> (!musimFilter.fieldId || c.fieldId===musimFilter.fieldId) && (!musimFilter.status || c.status===musimFilter.status));
  cycles.sort((a,b)=> (b.tanggalMulai||'').localeCompare(a.tanggalMulai||''));

  let listHtml = '';
  if(!cycles.length){
    listHtml = `<div class="card card-pad" style="text-align:center;color:var(--ink-mute);font-size:13px;padding:30px;">Tidak ada siklus tanam yang cocok dengan filter.</div>`;
  } else {
    listHtml = cycles.map(c=>{
      const field = db.fields.find(f=>f.id===c.fieldId);
      const fin = cycleFinance(c.id);
      return `<div class="list-item" data-cycle="${c.id}">
        <div class="li-icon">${ICONS.seed}</div>
        <div class="li-body">
          <div class="li-title">${escapeHtml(c.komoditas)}${c.varietas?' · '+escapeHtml(c.varietas):''}</div>
          <div class="li-sub">${escapeHtml(field?field.nama:'?')} · ${escapeHtml(c.musim)} · ${fmtDateShort(c.tanggalMulai)}</div>
        </div>
        <div class="li-trail">
          <span class="chip chip-${c.status}">${STATUS_SIKLUS[c.status]}</span>
          <div class="amt ${fin.profit>=0?'good':'bad'}" style="margin-top:4px;">${fmtRp(fin.profit)}</div>
        </div>
      </div>`;
    }).join('');
  }

  root.innerHTML = `
    <div class="filter-row">
      <select class="filter-select" id="musimFilterField">${fieldOpts}</select>
      <select class="filter-select" id="musimFilterStatus">${statusOpts}</select>
    </div>
    <button class="btn btn-primary btn-block" id="addCycleBtn" style="margin:12px 0 16px;">+ Tambah Siklus Tanam</button>
    ${listHtml}
  `;
  document.getElementById('musimFilterField').addEventListener('change', (e)=>{ musimFilter.fieldId=e.target.value; renderMusim(); });
  document.getElementById('musimFilterStatus').addEventListener('change', (e)=>{ musimFilter.status=e.target.value; renderMusim(); });
  document.getElementById('addCycleBtn').addEventListener('click', ()=>openCycleForm());
  root.querySelectorAll('[data-cycle]').forEach(el=> el.addEventListener('click', ()=> openCycleDetail(el.dataset.cycle)));
}

function openCycleForm(id, presetFieldId){
  const c = id ? db.cycles.find(x=>x.id===id) : null;
  if(!db.fields.length){ toast('Tambahkan lahan terlebih dahulu'); return; }
  const fields = [
    { key:'fieldId', label:'Lahan', type:'select', required:true, options: db.fields.map(f=>({value:f.id,label:f.nama})), default: presetFieldId||(db.fields[0]||{}).id },
    { key:'komoditas', label:'Komoditas', type:'text', required:true, placeholder:'cth. Padi, Cabai, Jagung' },
    { key:'varietas', label:'Varietas (opsional)', type:'text', placeholder:'cth. Ciherang' },
    { key:'musim', label:'Nama Musim / Periode', type:'text', required:true, placeholder:'cth. MT1 2026', default:'MT1 '+new Date().getFullYear() },
    { key:'tanggalMulai', label:'Tanggal Mulai Tanam', type:'date', required:true, default: todayStr() },
    { key:'tanggalPanenTarget', label:'Target Tanggal Panen (opsional)', type:'date' },
    { key:'status', label:'Status', type:'select', options: Object.entries(STATUS_SIKLUS).map(([k,v])=>({value:k,label:v})), default:'berjalan' },
    { key:'catatan', label:'Catatan (opsional)', type:'textarea' }
  ];
  openFormSheet(c?'Ubah Siklus Tanam':'Tambah Siklus Tanam', fields, c, (data)=>{
    if(!data.komoditas.trim() || !data.fieldId){ toast('Lengkapi field wajib'); return false; }
    const saved = addOrUpdateCycle(data); toast('Siklus disimpan');
    if(currentTab==='cycle' && currentCycleId===saved.id){ openCycleDetail(saved.id, cycleDetailTab); } else { renderCurrentView(); }
  }, '', c ? ()=>{
    confirmDialog('Hapus Siklus Tanam?', 'Semua aktivitas, biaya, panen dan catatan pada siklus ini akan ikut terhapus.', ()=>{ deleteCycle(c.id); toast('Siklus dihapus'); if(currentTab==='cycle'){switchTab('musim');} else {renderCurrentView();} });
  } : null);
}

   ====================================================================== */
let pengadaanFilter = { kategori:'' };

function renderPengadaan(){
  const root = document.getElementById('view-pengadaan');
  let list = db.procurements.slice().sort((a,b)=> (b.tanggal||'').localeCompare(a.tanggal||'') || (b.createdAt||0)-(a.createdAt||0));
  if(pengadaanFilter.kategori) list = list.filter(p=>p.kategori===pengadaanFilter.kategori);

  const katOpts = `<option value="">Semua Kategori</option>` + Object.entries(KATEGORI_BIAYA).map(([k,v])=>`<option value="${k}" ${pengadaanFilter.kategori===k?'selected':''}>${v}</option>`).join('');

  let listHtml;
  if(!db.procurements.length){
    listHtml = `<div class="empty-state card"><div class="glyph">${ICONS.box.replace('currentColor','#fff')}</div><h3>Belum ada data Pengadaan</h3><p>Catat pembelian bibit, pupuk, pestisida, sewa alat, atau tenaga kerja di sini sebagai stok. Aktivitas di tiap siklus tanam nanti tinggal "memakai" stok ini, tanpa perlu input harga berulang-ulang.</p></div>`;
  } else if(!list.length){
    listHtml = `<div class="card card-pad" style="text-align:center;color:var(--ink-mute);font-size:13px;padding:30px;">Tidak ada data pada kategori ini.</div>`;
  } else {
    listHtml = list.map(p=>{
      const u = procurementUsage(p.id);
      const pct = p.jumlahBeli>0 ? Math.max(0, Math.min(100, (u.sisa/p.jumlahBeli)*100)) : 0;
      const habis = u.sisa<=0;
      const rendah = !habis && pct<20;
      return `<div class="list-item" data-proc="${p.id}" style="flex-direction:column;align-items:stretch;gap:8px;">
        <div style="display:flex;align-items:center;gap:12px;">
          <div class="li-icon">${ICONS.box}</div>

function openProcurementForm(id){
  const p = id ? db.procurements.find(x=>x.id===id) : null;
  const fields = [
    { key:'nama', label:'Nama Barang / Jasa', type:'text', required:true, placeholder:'cth. NPK Mutiara 16-16-16' },
    { key:'kategori', label:'Kategori', type:'select', options: Object.entries(KATEGORI_BIAYA).map(([k,v])=>({value:k,label:v})) },
    { key:'tanggal', label:'Tanggal Beli', type:'date', required:true, default: todayStr() },
    { key:'jumlahBeli', label:'Jumlah Dibeli', type:'number', step:'0.01', required:true, placeholder:'cth. 50' },
    { key:'satuan', label:'Satuan', type:'text', placeholder:'kg/liter/paket/HOK' },
    { key:'hargaSatuan', label:'Harga Satuan (Rp)', type:'number', step:'1', required:true, placeholder:'cth. 11000' },
    { key:'catatan', label:'Catatan (opsional)', type:'textarea' }
  ];
  let usageHtml = '';
  if(p){
    const u = procurementUsage(p.id);
    usageHtml = `<div class="divider"></div><div style="font-weight:700;font-size:13px;color:var(--forest-3);margin-bottom:8px;">Riwayat Pemakaian</div>`;
    if(!u.uses.length){
      usageHtml += `<div class="hint" style="margin-bottom:10px;">Belum pernah dipakai di aktivitas manapun.</div>`;
    } else {
      usageHtml += u.uses.map(x=>{
        const c = db.cycles.find(cy=>cy.id===x.activity.cycleId);
        return `<div style="display:flex;justify-content:space-between;font-size:12px;padding:7px 0;border-bottom:1px solid var(--line);"><span style="color:var(--ink-soft);">${fmtDateShort(x.activity.tanggal)} · ${escapeHtml(c?c.komoditas:'?')} · ${JENIS_AKTIVITAS[x.activity.jenis]||x.activity.jenis}</span><span style="font-weight:700;">${fmtNum(x.pemakaian.jumlah)} ${escapeHtml(p.satuan||'')}</span></div>`;
      }).join('');
      usageHtml += `<div style="text-align:right;font-weight:700;margin-top:10px;font-size:13.5px;">Sisa Stok: <span style="color:${u.sisa<=0?'var(--bad)':'var(--good)'}">${fmtNum(u.sisa)} ${escapeHtml(p.satuan||'')}</span></div>`;
    }
  }
  openFormSheet(p?'Ubah Pengadaan':'Tambah Pengadaan Baru', fields, p, (data)=>{
    if(!data.nama.trim()){ toast('Nama wajib diisi'); return false; }
    addOrUpdateProcurement(data); toast('Pengadaan disimpan'); renderCurrentView();
  }, '', p ? ()=>{
    const u = procurementUsage(p.id);
    const msg = u.uses.length ? `Item ini sudah dipakai di ${u.uses.length} aktivitas. Menghapusnya TIDAK akan mengubah catatan biaya yang sudah tercatat di aktivitas tersebut, hanya menghapus data pengadaan & pelacakan stoknya.` : 'Data pengadaan ini akan dihapus permanen.';
    confirmDialog('Hapus Pengadaan?', msg, ()=>{ deleteProcurement(p.id); toast('Pengadaan dihapus'); renderCurrentView(); });
  } : null, usageHtml);
}

/* ---- Activity form (with dynamic cost items) ---- */
function openActivityForm(cycleId, actId){
  const a = actId ? db.activities.find(x=>x.id===actId) : null;
  // Aktivitas hanyalah catatan kejadian — biaya bersifat opsional dan diambil dengan
  // "memakai" stok dari Pengadaan, bukan diketik ulang setiap kali.
  let pemakaian = a ? structuredClone(a.pemakaian||[]) : [];

  function procOptionsHtml(selectedId){
    if(!db.procurements.length) return '<option value="">Belum ada data Pengadaan</option>';
    const opts = ['<option value="">— pilih barang / jasa —</option>'];
    db.procurements.slice().sort((x,y)=> (x.nama||'').localeCompare(y.nama||'')).forEach(p=>{
      const u = procurementUsage(p.id);
      // include current row's own already-counted amount back into sisa when editing this activity
      opts.push(`<option value="${p.id}" ${selectedId===p.id?'selected':''}>${escapeHtml(p.nama)} · sisa ${fmtNum(u.sisa)} ${escapeHtml(p.satuan)}</option>`);
    });
    return opts.join('');
  }
  function pemakaianRowHtml(p, idx){
    const proc = p.procurementId ? db.procurements.find(x=>x.id===p.procurementId) : null;
    const harga = proc ? proc.hargaSatuan : (p.hargaSatuan||0);
    const jumlah = p.jumlah||0;
    return `<div class="item-row" data-idx="${idx}">
      <button type="button" class="rm-row" data-rm="${idx}">${ICONS.trash}</button>
      <div class="field"><label>Barang / Jasa dari Pengadaan</label>
        <select id="pk_proc_${idx}">${procOptionsHtml(p.procurementId)}</select>
      </div>
      <div class="field"><label>Jumlah Dipakai${proc&&proc.satuan?' ('+escapeHtml(proc.satuan)+')':''}</label><input type="number" step="0.01" id="pk_jml_${idx}" value="${jumlah}"></div>
      <div class="item-total" id="pk_total_${idx}">Biaya: ${fmtRp(jumlah*harga)}</div>
    </div>`;
  }
  function quickProcPanelHtml(){
    return `<div id="quickProcPanel" class="item-row" style="display:none;border-style:solid;background:#fff;">
      <div style="font-weight:700;font-size:12.5px;color:var(--forest-3);margin-bottom:10px;">Pengadaan Baru</div>
      <div class="field"><label>Nama Barang / Jasa</label><input type="text" id="qp_nama" placeholder="cth. Pupuk NPK Mutiara"></div>
      <div class="field-row">
        <div class="field"><label>Kategori</label><select id="qp_kategori">${Object.entries(KATEGORI_BIAYA).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div>
        <div class="field"><label>Satuan</label><input type="text" id="qp_satuan" placeholder="kg/liter/paket"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Jumlah Dibeli</label><input type="number" step="0.01" id="qp_jumlahBeli" value="1"></div>
        <div class="field"><label>Harga Satuan (Rp)</label><input type="number" step="1" id="qp_harga" value="0"></div>
      </div>
      <button type="button" class="btn btn-primary btn-sm btn-block" id="quickProcSave">Simpan &amp; Pakai di Aktivitas Ini</button>
    </div>`;
  }

  function fullBodyHtml(){
    return `
      <div class="field"><label>Jenis Aktivitas</label>
        <select id="fld_jenis">${Object.entries(JENIS_AKTIVITAS).map(([k,v])=>`<option value="${k}" ${(a?a.jenis:'')===k?'selected':''}>${v}</option>`).join('')}</select>
      </div>
      <div class="field-row">
        <div class="field"><label>Tanggal</label><input type="date" id="fld_tanggal" value="${a?a.tanggal:todayStr()}"></div>
        <div class="field"><label>Perlakuan (opsional)</label><input type="text" id="fld_perlakuan" value="${escapeHtml(a?a.perlakuan:'')}" placeholder="cth. NPK Mutiara"></div>
      </div>
      <div class="hint" style="margin:-6px 0 14px;">Isi "Perlakuan" jika ingin membandingkan efektivitas produk/metode ini nanti di tab Analisis.</div>
      <div class="divider"></div>
      <div style="font-weight:700;font-size:13px;color:var(--forest-3);margin-bottom:4px;">Pemakaian dari Pengadaan (opsional)</div>
      <div class="hint" style="margin-bottom:10px;">Tidak semua aktivitas butuh biaya — lewati bagian ini jika aktivitas ini tidak memakai barang/jasa apa pun.</div>
      <div id="pemakaianWrap">${pemakaian.map(pemakaianRowHtml).join('')}</div>
      <div class="swipe-actions" style="margin-bottom:10px;">
        <button type="button" class="btn btn-outline btn-sm" id="addPemakaianRow" style="flex:1;">+ Tambah Pemakaian</button>
        <button type="button" class="btn btn-ghost btn-sm" id="toggleQuickProc" style="flex:1;">+ Pengadaan Baru</button>
      </div>
      ${quickProcPanelHtml()}
      <div style="text-align:right;font-weight:700;margin-top:8px;font-size:15px;color:var(--forest-3);" id="grandTotal">Total Biaya: ${fmtRp(pemakaian.reduce((s,p)=>{ const proc=db.procurements.find(x=>x.id===p.procurementId); return s+(p.jumlah||0)*(proc?proc.hargaSatuan:0); },0))}</div>
      <div class="divider"></div>
      <div class="field"><label>Catatan (opsional)</label><textarea id="fld_catatan" placeholder="cth. Kondisi cuaca, kendala, dsb.">${escapeHtml(a?a.catatan:'')}</textarea></div>
    `;
  }

  function rowBiaya(idx){
    const procEl = document.getElementById('pk_proc_'+idx);
    const jmlEl = document.getElementById('pk_jml_'+idx);
    if(!procEl || !jmlEl) return 0;
    const proc = db.procurements.find(x=>x.id===procEl.value);
    const jumlah = Number(jmlEl.value)||0;
    return proc ? jumlah*proc.hargaSatuan : 0;
  }
  function updateGrandTotal(){
    const wrap = document.getElementById('pemakaianWrap');
    const idxs = [...wrap.querySelectorAll('.item-row')].map(r=>r.dataset.idx);
    const total = idxs.reduce((s,idx)=> s+rowBiaya(idx), 0);
    document.getElementById('grandTotal').textContent = 'Total Biaya: ' + fmtRp(total);
  }
  function readPemakaianFromDom(){
    const wrap = document.getElementById('pemakaianWrap');
    return [...wrap.querySelectorAll('.item-row')].map(row=>{
      const idx = row.dataset.idx;
      return { procurementId: document.getElementById('pk_proc_'+idx).value, jumlah: Number(document.getElementById('pk_jml_'+idx).value)||0 };
    });
  }
  function bindPemakaianEvents(){
    document.querySelectorAll('#pemakaianWrap select, #pemakaianWrap input').forEach(el=>{
      el.addEventListener('input', ()=>{
        const idx = el.id.split('_').pop();
        document.getElementById('pk_total_'+idx).textContent = 'Biaya: ' + fmtRp(rowBiaya(idx));
        updateGrandTotal();
      });
    });
    document.querySelectorAll('#pemakaianWrap [data-rm]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const idx = Number(btn.dataset.rm);
        pemakaian = readPemakaianFromDom(); pemakaian.splice(idx,1); rerenderPemakaian();
      });
    });
  }
  function rerenderPemakaian(){
    document.getElementById('pemakaianWrap').innerHTML = pemakaian.map(pemakaianRowHtml).join('');
    bindPemakaianEvents(); updateGrandTotal();
  }

  const buttons = [];

/* ---- Rencana Kegiatan form ---- */
function openPlanForm(cycleId, planId){
  const p = planId ? db.plans.find(x=>x.id===planId) : null;
  const initialCycleId = p ? p.cycleId : cycleId;
  let recurrenceType = p ? (p.recurrenceType==='sekali' ? 'sekali' : (['3','7','14','30'].includes(String(p.intervalHari)) ? String(p.intervalHari) : 'custom')) : 'sekali';
  let customInterval = (p && recurrenceType==='custom') ? p.intervalHari : 7;

  function cycleOptionsHtml(){
    let opts = `<option value="">Umum (tidak terikat siklus)</option>`;
    db.cycles.forEach(cy=>{
      const f = db.fields.find(x=>x.id===cy.fieldId);
      opts += `<option value="${cy.id}" ${initialCycleId===cy.id?'selected':''}>${escapeHtml(cy.komoditas)} · ${escapeHtml(f?f.nama:'')} (${escapeHtml(cy.musim)})</option>`;
    });
    return opts;
  }
  function pillsHtml(){
    return RECURRENCE_PRESETS.map(opt=> `<div class="pill ${recurrenceType===opt.value?'active':''}" data-rec="${opt.value}">${opt.label}</div>`).join('');
  }
  function bodyHtml(){
    return `
      <div class="field"><label>Judul Rencana</label><input type="text" id="fld_judul" value="${escapeHtml(p?p.judul:'')}" placeholder="cth. Semprot pestisida susulan"></div>
      <div class="field"><label>Terkait Siklus</label><select id="fld_cycleId">${cycleOptionsHtml()}</select></div>
      <div class="field"><label>Jenis (opsional)</label><select id="fld_jenis">${Object.entries(JENIS_AKTIVITAS).map(([k,v])=>`<option value="${k}" ${(p?p.jenis:'lainnya')===k?'selected':''}>${v}</option>`).join('')}</select></div>
      <div class="field"><label>Tanggal Mulai</label><input type="date" id="fld_tanggalMulai" value="${p?p.tanggalMulai:todayStr()}"></div>
      <div class="field"><label>Pengulangan</label><div class="pill-row" id="recPills">${pillsHtml()}</div></div>
      <div class="field" id="customIntervalField" style="${recurrenceType==='custom'?'':'display:none'}"><label>Tiap Berapa Hari?</label><input type="number" min="1" id="fld_customInterval" value="${customInterval}"></div>
      <div class="hint" id="recHint" style="margin-top:-8px;margin-bottom:14px;">${recPillHint(recurrenceType)}</div>
      <div class="field"><label>Catatan (opsional)</label><textarea id="fld_catatan" placeholder="cth. Detail dosis, target area, dll.">${escapeHtml(p?p.catatan:'')}</textarea></div>
    `;
  }

  function afterSave(){
    updateBellBadge();
    if(currentTab==='cycle') renderCycleDetail(); else renderCurrentView();
  }

  const buttons = [];
  if(p) buttons.push({ label:'Hapus', cls:'btn-danger', block:false, onClick: ()=>{
    confirmDialog('Hapus Rencana?', 'Rencana kegiatan ini akan dihapus permanen.', ()=>{ deletePlan(p.id); toast('Rencana dihapus'); closeSheet(); afterSave(); });
  }});
  buttons.push({ label:'Batal', cls:'btn-ghost', block:false, onClick: closeSheet });
  buttons.push({ label:'Simpan', cls:'btn-primary', onClick: ()=>{
    const judul = document.getElementById('fld_judul').value.trim();
    if(!judul){ toast('Judul rencana wajib diisi'); return; }
    const data = {
      id: p?p.id:undefined, judul,
      cycleId: document.getElementById('fld_cycleId').value || null,
      jenis: document.getElementById('fld_jenis').value,
      tanggalMulai: document.getElementById('fld_tanggalMulai').value || todayStr(),
      recurrenceType: recurrenceType==='sekali' ? 'sekali' : 'interval',
      intervalHari: recurrenceType==='sekali' ? null : (recurrenceType==='custom' ? (Number(document.getElementById('fld_customInterval').value)||7) : Number(recurrenceType)),
      catatan: document.getElementById('fld_catatan').value,
      lastDoneDate: p?p.lastDoneDate:null, status: p?p.status:'aktif'
    };
    addOrUpdatePlan(data); toast('Rencana disimpan'); closeSheet(); afterSave();
  }});

  openSheet(p?'Ubah Rencana':'Tambah Rencana Kegiatan', bodyHtml(), buttons);
  document.querySelectorAll('#recPills .pill').forEach(el=>{
    el.addEventListener('click', ()=>{
      recurrenceType = el.dataset.rec;
      document.querySelectorAll('#recPills .pill').forEach(p2=> p2.classList.toggle('active', p2.dataset.rec===recurrenceType));
      document.getElementById('customIntervalField').style.display = recurrenceType==='custom' ? 'block' : 'none';
      document.getElementById('recHint').textContent = recPillHint(recurrenceType);
    });
  });
}
function recPillHint(recurrenceType){
  return recurrenceType==='sekali' ? 'Pengingat muncul sekali pada tanggal di atas.' : 'Tiap kali ditandai "selesai", pengingat berikutnya otomatis dijadwalkan dari tanggal selesai + interval.';
}

      deleteDiagnosis(d.id); toast('Dihapus'); closeSheet();

    try{

      document.getElementById('fotoPreviewWrap').innerHTML = `<img src="${fotoDataUrl}" class="foto-preview" id="fotoPreview">`;
      toast('Foto siap');
    }catch(err){ toast('Gagal memproses foto'); }

    aiBtnWrap.innerHTML = `<button type="button" class="btn btn-block" id="askAiBtn" style="background:linear-gradient(120deg,#4a3aa7,#7a5fd4);color:#fff;margin-bottom:10px;">${ICONS.robot} Tanya AI (butuh internet)</button>`;
